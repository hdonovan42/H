# chess.hjd.ai — static chess analysis board
# Served with cross-origin isolation headers so SharedArrayBuffer is available
# and the multi-threaded Stockfish builds can run. certbot --nginx manages TLS.
server {
    listen 80;
    listen [::]:80;
    server_name chess.hjd.ai;

    root /var/www/chess;
    index analysis.html;

    # Cross-origin isolation — unlocks threaded Stockfish (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types application/wasm application/javascript text/css;
    gzip_min_length 1024;

    # Engine wasm + vendored libs are versioned/content-hashed — cache forever.
    # add_header in a location block replaces inherited headers, so COOP/COEP
    # must be repeated here.
    location ~* ^/js/(vendor/|stockfish.*\.wasm$) {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
