# Cloudflare Worker Configuration
# Chess Coach API - Claude API Proxy

name = "chess-coach"
main = "index.js"
compatibility_date = "2024-01-01"

# Account ID (optional - Wrangler can auto-detect)
# account_id = "your-account-id"

# Workers route (optional - for custom domain)
# routes = [
#   { pattern = "chess-coach.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (set these with `wrangler secret put`)
# Required secrets:
#   - ANTHROPIC_API_KEY: Your Anthropic API key
#   - FIREBASE_PROJECT_ID: Your Firebase project ID

[vars]
# Non-sensitive environment variables go here
# FIREBASE_PROJECT_ID can also be set here if not sensitive

# Development settings
[env.dev]
name = "chess-coach-dev"

# Production settings
[env.production]
name = "chess-coach"
