<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess analysis</title>
  <!-- chess2 at the analysis board's original address; the first version
       lives on at analysisRetro.html.
       GitHub Pages can't send COOP/COEP headers; this service worker adds them
       (one reload on the first visit) so Stockfish can use threads. It must be
       the first script, and it only covers this folder, so chess2 and its
       engine workers live inside it (./chess2/). -->
  <script src="coi-serviceworker.min.js"></script>
  <link rel="icon" type="image/png" href="/images/H-favicon.png">
  <link rel="stylesheet" href="chess2/board.css">
  <link rel="stylesheet" href="chess2/style.css">
  <script type="module" src="chess2/js/main.js"></script>
</head>
<body>
  <main>
    <section class="play">
      <div class="player top"></div>
      <div class="evalbar"></div>
      <div class="board"></div>
      <div class="player bottom"></div>
    </section>
    <section class="side">
      <div class="engine">
        <header><b class="score"></b><span class="info"></span><button class="settings" title="Choose the engine (l)" aria-label="Choose the engine" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <div class="menu" role="menu" aria-label="Engine" hidden>
            <button role="menuitemradio" value="full"><b>Stockfish 19</b><small>Full strength · 94 MB</small></button>
            <button role="menuitemradio" value="lite"><b>Stockfish 19 Lite</b><small>Fast and light · 1.6 MB</small></button>
          </div><button class="toggle" title="Engine on or off (t)"></button></header>
        <ol class="lines"></ol>
        <p class="tb"></p>
      </div>
      <div class="moves"><p class="opening"></p><div class="list"></div></div>
      <div class="graph" hidden></div>
      <form class="load">
        <textarea rows="1" placeholder="Paste a PGN, FEN or Lichess link" aria-label="Game to load" spellcheck="false"></textarea>
        <button type="button" class="setup" title="Set up a position (e)">Set up</button>
      </form>
      <div class="editor"></div>
      <p class="foot"><span class="status" role="status"></span><span class="keys">← → moves · ↑ ↓ ends · f flip · t engine · space best · e edit · r reset</span><span class="keys editing">K q … pick · s start · c empty · x eraser · ⏎ analyse · Esc cancel</span></p>
    </section>
  </main>
</body>
</html>
