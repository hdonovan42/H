server {
    listen 80;
    server_name axiom.hjd.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name axiom.hjd.ai;

    ssl_certificate /etc/letsencrypt/live/axiom.hjd.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiom.hjd.ai/privkey.pem;

    # Frontend — serve built SPA
    root /home/hq/axiom2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Basic auth for the whole site
        auth_basic "AXIOM v2";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # API proxy — pass through to Express
    location /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;

        auth_basic "AXIOM v2";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # WhatsApp webhook — no auth (called by moltbot on localhost)
    location /api/v2/whatsapp/webhook {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        auth_basic off;

        # Only allow from localhost
        allow 127.0.0.1;
        deny all;
    }
}
