[project]
name = "vault"
version = "0.1.0"
description = "VAULT — Variable Autonomous Utility & Ledger Testbed"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "py-clob-client>=0.34.0",
    "web3>=6.0",
]

[project.scripts]
vault = "vault.cli:cli"

[tool.setuptools.packages.find]
include = ["vault*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
