# VAULT Default Configuration
# Override by creating config.yaml in project root (gitignored)

seed_balance: 50.00

polygon_rpc_url: "https://polygon-bor-rpc.publicnode.com"

daemon:
  interval_seconds: 60         # 1 minute between cycles (auto-hold makes idle cycles free)
  pid_file: vault.pid
  db_file: vault.db

agent:
  default_model: claude-haiku-4-5-20251001
  max_rounds_per_cycle: 4       # research + search + bet + write_memory
  max_cycle_cost_pct: 0.006     # 0.6% of balance per cycle (~$0.50 at $84)

trading:
  allowed_assets: []             # crypto trading disabled — Polymarket only
  simulated: true
  clob:
    host: "https://clob.polymarket.com"
    chain_id: 137
    signature_type: 0            # 0=EOA (direct wallet, no proxy)
    slippage_pct: 0.02           # 2% max slippage on FOK orders
    balance_reconcile: true
    balance_drift_warn: 0.50
    fallback_on_failure: "skip"  # "skip" or "paper"
    reconcile_interval_cycles: 10       # check for deposits every 10 cycles
    orphan_sweep_interval_cycles: 30    # check for stuck pending/reconciling every 30 cycles
    pending_timeout_seconds: 300        # pending rows older than this are reconciled by orphan sweep
    dry_run_startup_cycles: 20          # first N cycles log-only (raised from 5 after 15-Mar incident)
    balance_divergence_tolerance: 0.50  # auto-pause if ledger vs on-chain drift > $0.50 (tightened from $1.00)
    rpc_failure_pause_threshold: 3      # auto-pause after N consecutive None returns from RPC
    max_bet_pct_onchain: 0.10           # max 10% of on-chain USDC per bet (real mode hard cap)
    verify_ctf_on_confirm: true         # verify on-chain shares after CLOB success before ledger debit
    rpc_fallback:                        # ordered fallback list; first working provider wins
      - "https://polygon-bor-rpc.publicnode.com"
      - "https://polygon.drpc.org"
      - "https://polygon-rpc.com"

polymarket:
  cache_ttl_seconds: 300        # 5 min cache for market data
  trending_count: 5             # number of trending markets in system prompt
  max_bet_pct: 0.20             # max 20% of balance per bet

pipeline:
  enabled: true

musk_ecosystem:
  x_accounts: ["elonmusk", "SawyerMerritt", "farzyness", "TeslaLarry", "jamesdouma"]
  polymarket_keywords: ["Tesla", "SpaceX", "Elon", "Musk", "xAI", "Neuralink", "Starship"]
  x_posts_per_call: 10

digest:
  max_age_hours: 4
  hours_back: 48
  model: claude-haiku-4-5-20251001

intelligence:
  model: claude-opus-4-6
  update_hour_utc: 0
  raw_tweet_hours: 24

sentinel:
  model: claude-haiku-4-5-20251001
  enabled: true

edge:
  margin_of_safety: 0.10
  max_kelly_fraction: 0.25
  risk_free_daily_rate: 0.0001
  min_confidence: 0.4
  market_duration_days: 30             # assumed avg market duration for risk-free comparison
  estimator_model: claude-haiku-4-5-20251001

velocity:
  sharp_threshold_1h: 0.05
  sharp_threshold_6h: 0.10
  veto_enabled: true
  boost_amount: 0.15
  haircut_amount: 0.15
  momentum_enabled: true
  momentum_model: claude-haiku-4-5-20251001
  momentum_follow_confidence: 0.6   # Haiku must be this confident to follow
  momentum_base_bet_pct: 0.025      # 2.5% of total value (~$2.10 at $84)
  momentum_max_bet_pct: 0.10        # 10% of total value (~$8.40 at $84)
  momentum_vel_scale_20: 1.5        # 1.5x at |v_1h| >= 20%
  momentum_vel_scale_40: 2.0        # 2x at |v_1h| >= 40%
  momentum_pyramid_enabled: false     # DISABLED — pyramid adds killed, shadow mode active
  momentum_add_min_roi: 0.02         # only add if existing position ROI > 2% (filters noise)
  momentum_add_cooldown_minutes: 10  # minimum minutes between adds to same market+side
  max_momentum_per_cycle: 3
  momentum_max_exposure_pct: 0.50
  momentum_min_volume: 5000      # skip markets below $5k volume (thin/manipulable)
  z_min_snapshots: 30            # need 30+ snapshots in 24h for reliable z-score
  z_sizing_low: 3.0              # z < 3: haircut confidence (noisy move)
  z_sizing_high: 4.0             # z >= 4: boost confidence (significant move)
  z_confidence_boost: 0.15       # +15% confidence for high-z moves
  z_confidence_haircut: 0.10     # -10% confidence for low-z moves (skipped for profitable adds)
  opportunity_cost_annual: 0.10  # 10% annual — exit when remaining return < risk-free over same period
  opportunity_cost_default_days: 30  # fallback when market has no end_date
  stale_min_hours_profitable: 3.0   # let winning momentum positions breathe (was 2.0 — 1-2h is the profit sweet spot)
  stale_min_hours_losing: 0.5      # cut losers fast (was 1.0 — <1h trades lose -$27.46 on 163 trades)
  stale_max_hours: 4.0            # force exit stale positions after 4h even at a loss
  stale_velocity_threshold: 0.02  # v_1h < 2% = "momentum stalled"
  momentum_unrealised_loss_floor: -0.05  # block entry when existing positions down 5%+
  momentum_max_positions_per_market: 1  # hard cap: 1 position per market (pyramid disabled)
  momentum_min_velocity_1h: 0.10   # minimum |v_1h| for momentum entry (new + adds)
  momentum_min_velocity_1h_sports: 0.05  # lower floor for sports/esports (filtered by O/U/draw already)
  momentum_flip_window_hours: 4.0      # look-back for detecting both-side trades
  momentum_flip_cooldown_hours: 1.0    # block re-entry for 1h after multi-flip detected
  failed_market_cooldown_minutes: 10   # skip markets that failed CLOB execution recently
  side_switch_min_velocity_1h: 0.15    # 15% — side-switches need stronger signal than normal entries
  # Oscillation detector (Mode B dampener)
  oscillation_lookback_hours: 2.0         # window for counting reversals
  oscillation_min_swing: 0.08             # 8pp minimum to count as a reversal
  oscillation_max_reversals: 6            # >= this triggers dampener
  oscillation_net_move_override: 0.15     # allow if |net move| > 15% (trending through noise)
  # Burned-market guard — cap exposure on markets with realised losses
  burned_market_lookback_hours: 4.0       # window to sum realised P&L
  burned_market_loss_threshold: -2.00     # net P&L <= this triggers guard
  z_override_min_velocity: 0.07    # z-gate floor: must still have 7%+ velocity
  z_override_threshold: 4.0        # z-score must be >= 4.0 to override velocity floor
  trailing_stop_drop: 0.15           # exit when ROI drops 15pp below peak
  trailing_stop_min_peak: 0.15       # only fire if peak ROI was >= 15%
  trailing_stop_min_pnl_pct: 0.05    # 5% of cost basis (e.g. $0.10 on $2 bet)
  smart_haiku_routing: true            # skip Haiku for clear signals, route only flagged ones
  haiku_route_near_resolution_hours: 2.0  # route to Haiku if < 2h to expiry
  haiku_route_min_liquidity: 1000.0       # route if liquidity in $1K-$5K gray zone
  haiku_route_max_liquidity: 5000.0
  haiku_route_ambiguous_category: true    # route non-sports markets with " vs " in question

# Shadow pyramid — log what reworked pyramid adds WOULD have done (A/B test)
shadow_pyramid:
  enabled: true
  variants:
    strict:
      max_adds: 1              # max 1 add per market+side
      pyramid_mult: 1.0        # no size inflation
      min_roi: 0.15            # only add to strong winners (15%+)
      cooldown_minutes: 30     # 30 min between shadow adds
    relaxed:
      max_adds: 2              # max 2 adds per market+side
      pyramid_mult: 1.5        # modest 1.5x multiplier
      min_roi: 0.05            # 5%+ ROI gate
      cooldown_minutes: 15     # 15 min cooldown

drawdown_circuit_breaker:
  enabled: true
  max_drawdown_pct: 0.25

snapshot_prune_keep_hours: 48         # keep all snapshots within this window
snapshot_prune_interval_cycles: 50    # prune every N cycles

backtest_interval_cycles: 10080       # run safeguard backtester every ~7 days (at 60s intervals)

# Model pricing (USD per 1M tokens) — updated for Claude 4.5/4.6
# These are used to calculate cost from token counts
pricing:
  claude-opus-4-6:
    input: 15.00
    output: 75.00
  claude-sonnet-4-6-20250514:
    input: 3.00
    output: 15.00
  claude-sonnet-4-5-20250929:
    input: 3.00
    output: 15.00
  claude-haiku-4-5-20251001:
    input: 0.80
    output: 4.00
