<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadtrip Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Map -->
    <div id="map"></div>

    <!-- Floating Toggle Button (appears when sidebar is collapsed) -->
    <button class="floating-toggle" id="floatingToggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="search-container">
            <div class="search-box">
                <button class="toggle-sidebar" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search for a location..." />
                </div>
                <button class="waypoint-action" onclick="resetTrip()" title="Reset Trip">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </div>

        <div class="waypoints-container" id="waypointsList">
            <div class="empty-state">
                <i class="fas fa-map-marked-alt"></i>
                <p>No waypoints added yet</p>
                <p>Search for locations to get started</p>
            </div>
        </div>

        <!-- Sidebar Stats Panel -->
        <div class="sidebar-stats" id="sidebarStats">
            <div class="stats-title">
                <i class="fas fa-chart-line"></i>
                Trip Statistics
            </div>

            <div class="stat-item">
                <span class="stat-label">Total Distance</span>
                <span class="stat-value" id="totalDistance">0 km</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Road Distance</span>
                <span class="stat-value" id="roadDistance">0 km</span>
            </div>  
            <div class="stat-item">
                <span class="stat-label">Estimated Time</span>
                <span class="stat-value" id="estimatedTime">0h 0m</span>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>

    </body>
</html>
