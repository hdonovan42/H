<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // WORKER URL
    const WORKER_URL = 'https://dry-poetry-72b5.donovanh59.workers.dev';
    
    // Finnhub WebSocket for real-time prices
    const FINNHUB_API_KEY = 'd5306hpr01qggm5ue050d5306hpr01qggm5ue05g'; // Get free key at https://finnhub.io/

    // Cache duration: 24 hours
    const CACHE_DURATION = 60 * 60 * 1000; // 1 hour

    function StockTracker() {
      const [ticker, setTicker] = useState('TSLA');
      const [inputTicker, setInputTicker] = useState('');
      const [data, setData] = useState([]);
      const [chartData, setChartData] = useState([]);
      const [timeframe, setTimeframe] = useState('6M');
      const [quote, setQuote] = useState(null);
      const [metrics, setMetrics] = useState(null);
      const [loading, setLoading] = useState(true);
      const [priceUpdating, setPriceUpdating] = useState(false);
      const [chartUpdating, setChartUpdating] = useState(false);
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [sharesCount, setSharesCount] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [yahooData, setYahooData] = useState(null);
      
      // Chart cache for instant timeframe switching
      const [chartCache, setChartCache] = useState({});
      
      // Track last price to avoid unnecessary updates
      const lastPriceRef = useRef(null);
      
      // WebSocket for real-time Finnhub data
      const wsRef = useRef(null);
      const [wsConnected, setWsConnected] = useState(false);
      const currentSymbolRef = useRef(null);
      
      // New State for Google-style Hover
      const [hoverData, setHoverData] = useState(null);
      const svgRef = useRef(null);

      const getCachedData = (symbol) => {
        const cached = localStorage.getItem(`stock_${symbol}`);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < CACHE_DURATION) {
            console.log('Using cached data for', symbol);
            return data;
          }
        }
        return null;
      };

      const setCachedData = (symbol, data) => {
        localStorage.setItem(`stock_${symbol}`, JSON.stringify({ data, timestamp: Date.now() }));
        console.log('Cached data for', symbol);
      };

      const fetchYahooQuote = async (symbol) => {
        try {
          const response = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=1d&interval=1d&includePrePost=true`);
          const data = await response.json();
          
          if (data?.chart?.result?.[0]) {
            const result = data.chart.result[0];
            const meta = result.meta;
            const quote = result.indicators.quote[0];
            
            const currentPrice = meta.regularMarketPrice || meta.previousClose;
            const isPostMarket = meta.postMarketPrice !== undefined;
            const isPreMarket = meta.preMarketPrice !== undefined;
            
            let displayPrice, priceSource;
            if (isPostMarket) {
              displayPrice = meta.postMarketPrice;
              priceSource = 'post-market';
            } else if (isPreMarket) {
              displayPrice = meta.preMarketPrice;
              priceSource = 'pre-market';
            } else {
              displayPrice = currentPrice;
              priceSource = 'regular-market';
            }
            
            const yahooQuote = {
              currentPrice: displayPrice,
              regularMarketPrice: meta.regularMarketPrice,
              previousClose: meta.previousClose,
              open: quote.open?.[0] || meta.chartPreviousClose || meta.previousClose,
              high: quote.high?.[0] || meta.regularMarketPrice,
              low: quote.low?.[0] || meta.regularMarketPrice,
              volume: quote.volume?.[0] || meta.regularMarketVolume || 0,
              priceSource: priceSource,
              marketState: meta.marketState,
              shortName: meta.shortName || meta.symbol,
              preMarketPrice: meta.preMarketPrice,
              preMarketChange: meta.preMarketChange,
              preMarketChangePercent: meta.preMarketChangePercent,
              postMarketPrice: meta.postMarketPrice,
              postMarketChange: meta.postMarketChange,
              postMarketChangePercent: meta.postMarketChangePercent
            };
            
            return yahooQuote;
          }
        } catch (error) {
          console.error('Yahoo Finance fetch error:', error);
        }
        return null;
      };

      const getTradingDay = () => {
        const now = new Date();
        const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        const estHour = estTime.getHours();
        if (estHour < 9 || (estHour === 9 && estTime.getMinutes() < 30)) {
          const yesterday = new Date(estTime);
          yesterday.setDate(yesterday.getDate() - 1);
          return yesterday.toISOString().split('T')[0];
        }
        return estTime.toISOString().split('T')[0];
      };

      const isMarketOpen = () => {
        const now = new Date();
        const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        const day = estTime.getDay();
        const hour = estTime.getHours();
        const minute = estTime.getMinutes();
        if (day === 0 || day === 6) return false;
        const timeInMinutes = hour * 60 + minute;
        const marketOpen = 9 * 60 + 30;
        const marketClose = 16 * 60;
        return timeInMinutes >= marketOpen && timeInMinutes < marketClose;
      };

      const fetchAlpacaIntradayBars = async (symbol) => {
        const tradingDay = getTradingDay();
        const res = await fetch(
          `${WORKER_URL}/bars/${symbol}?start=${tradingDay}T00:00:00Z&end=${new Date().toISOString()}&timeframe=1Min&feed=iex`
        );
        const data = await res.json();
        
        if (data?.bars?.length > 0) {
          const bars = data.bars;
          return {
            open: bars[0].o,
            high: Math.max(...bars.map(b => b.h)),
            low: Math.min(...bars.map(b => b.l)),
            close: bars[bars.length - 1].c,
            volume: bars.reduce((sum, b) => sum + (b.v || 0), 0),
            source: 'alpaca-iex'
          };
        }
        return null;
      };

      const fetchAlpacaPreMarket = async (symbol) => {
        const now = new Date();
        const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        const todayStr = estTime.toISOString().split('T')[0];
        
        // Pre-market: 4:00 AM - 9:30 AM EST (08:00 - 13:30 UTC)
        const preMarketStart = `${todayStr}T08:00:00Z`;
        const preMarketEnd = `${todayStr}T13:30:00Z`;
        
        const res = await fetch(
          `${WORKER_URL}/bars/${symbol}?start=${preMarketStart}&end=${preMarketEnd}&timeframe=1Min&feed=sip`
        );
        const data = await res.json();
        
        if (data?.bars?.length > 0) {
          const lastBar = data.bars[data.bars.length - 1];
          return {
            currentPrice: lastBar.c,
            source: 'alpaca-sip-premarket'
          };
        }
        return null;
      };

      const fetchAlpacaPostMarket = async (symbol) => {
        const now = new Date();
        let lastTradingDay;
        
        if (now.getDay() === 0) {
          lastTradingDay = new Date(now);
          lastTradingDay.setDate(now.getDate() - 2);
        } else if (now.getDay() === 6) {
          lastTradingDay = new Date(now);
          lastTradingDay.setDate(now.getDate() - 1);
        } else {
          lastTradingDay = now;
        }
        
        const tradingDateStr = lastTradingDay.toISOString().split('T')[0];
        const postMarketStart = `${tradingDateStr}T21:00:00Z`;
        const endDate = new Date(lastTradingDay);
        endDate.setDate(endDate.getDate() + 1);
        const postMarketEndStr = `${endDate.toISOString().split('T')[0]}T01:00:00Z`;
        
        const res = await fetch(
          `${WORKER_URL}/bars/${symbol}?start=${postMarketStart}&end=${postMarketEndStr}&timeframe=1Min&feed=sip`
        );
        const data = await res.json();
        
        if (data?.bars?.length > 0) {
          const lastBar = data.bars[data.bars.length - 1];
          return {
            currentPrice: lastBar.c,
            source: 'alpaca-sip-postmarket'
          };
        }
        return null;
      };

      const fetchRealTimePrice = async (symbol) => {
        const marketOpen = isMarketOpen();
        
        if (marketOpen) {
          // During market hours: Use Yahoo for OHLV data
          // Finnhub WebSocket handles real-time price updates separately
          let yahooData = null;
          
          try {
            yahooData = await fetchYahooQuote(symbol);
          } catch (e) {
            console.log('Yahoo fetch failed:', e);
          }
          
          if (yahooData) {
            console.log('✓ Using Yahoo data for OHLV (Finnhub WebSocket handles live price)');
            return {
              currentPrice: yahooData.currentPrice,
              open: yahooData.open,
              high: yahooData.high,
              low: yahooData.low,
              previousClose: yahooData.previousClose,
              volume: yahooData.volume,
              source: 'yahoo',
              yahooData: yahooData,
              isMarketOpen: true
            };
          }
          
        } else {
          // Market is closed - check if pre-market or post-market
          const now = new Date();
          const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
          const estHour = estTime.getHours();
          const estMinute = estTime.getMinutes();
          const timeInMinutes = estHour * 60 + estMinute;
          const preMarketStart = 4 * 60; // 4:00 AM
          const marketOpen = 9 * 60 + 30; // 9:30 AM
          const marketClose = 16 * 60; // 4:00 PM
          
          const isPreMarketTime = timeInMinutes >= preMarketStart && timeInMinutes < marketOpen;
          const isPostMarketTime = timeInMinutes >= marketClose;
          
          let yahooData = null;
          try {
            yahooData = await fetchYahooQuote(symbol);
          } catch (e) {
            console.log('Yahoo fetch failed:', e);
          }
          
          // Try Alpaca pre-market
          if (isPreMarketTime) {
            try {
              const preMarketData = await fetchAlpacaPreMarket(symbol);
              if (preMarketData && yahooData) {
                console.log('✓ Using Alpaca SIP pre-market data');
                const updatedYahooData = {
                  ...yahooData,
                  preMarketPrice: preMarketData.currentPrice,
                  preMarketChange: preMarketData.currentPrice - yahooData.regularMarketPrice,
                  preMarketChangePercent: ((preMarketData.currentPrice - yahooData.regularMarketPrice) / yahooData.regularMarketPrice) * 100
                };
                return {
                  currentPrice: yahooData.regularMarketPrice,
                  open: yahooData.open,
                  high: yahooData.high,
                  low: yahooData.low,
                  previousClose: yahooData.previousClose,
                  volume: yahooData.volume,
                  source: 'alpaca-sip-premarket',
                  yahooData: updatedYahooData,
                  isMarketOpen: false
                };
              }
            } catch (e) {
              console.log('Alpaca SIP pre-market failed, using Yahoo...', e);
            }
          }
          
          // Try Alpaca post-market
          if (isPostMarketTime) {
            try {
              const postMarketData = await fetchAlpacaPostMarket(symbol);
              if (postMarketData && yahooData) {
                console.log('✓ Using Alpaca SIP post-market data');
                const updatedYahooData = {
                  ...yahooData,
                  postMarketPrice: postMarketData.currentPrice,
                  postMarketChange: postMarketData.currentPrice - yahooData.regularMarketPrice,
                  postMarketChangePercent: ((postMarketData.currentPrice - yahooData.regularMarketPrice) / yahooData.regularMarketPrice) * 100
                };
                return {
                  currentPrice: yahooData.regularMarketPrice,
                  open: yahooData.open,
                  high: yahooData.high,
                  low: yahooData.low,
                  previousClose: yahooData.previousClose,
                  volume: yahooData.volume,
                  source: 'alpaca-sip-postmarket',
                  yahooData: updatedYahooData,
                  isMarketOpen: false
                };
              }
            } catch (e) {
              console.log('Alpaca SIP post-market failed, using Yahoo...', e);
            }
          }
          
          if (yahooData) {
            console.log('✓ Using Yahoo data (market closed)');
            return {
              currentPrice: yahooData.regularMarketPrice,
              open: yahooData.open,
              high: yahooData.high,
              low: yahooData.low,
              previousClose: yahooData.previousClose,
              volume: yahooData.volume,
              source: 'yahoo',
              yahooData: yahooData,
              isMarketOpen: false
            };
          }
        }
        return null;
      };

      const fetchStockData = async (symbol) => {
        setLoading(true);
        try {
          const realTimeData = await fetchRealTimePrice(symbol);
          if (realTimeData?.yahooData) {
            setYahooData(realTimeData.yahooData);
            if (realTimeData.yahooData.shortName) {
              setCompanyName(realTimeData.yahooData.shortName);
            }
          }

          let historicalData = getCachedData(symbol);
          if (!historicalData) {
            const barsRes = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=6mo&interval=1d`);
            const barsData = await barsRes.json();
            if (barsData?.chart?.result?.[0]) {
              const result = barsData.chart.result[0];
              const timestamps = result.timestamp;
              const quote = result.indicators.quote[0];
              if (timestamps && quote) {
                historicalData = timestamps.map((t, i) => ({
                  date: new Date(t * 1000).toISOString().split('T')[0],
                  open: quote.open[i],
                  high: quote.high[i],
                  low: quote.low[i],
                  close: quote.close[i],
                  volume: quote.volume[i] || 0
                })).filter(day => day.close !== null)
                   .sort((a, b) => new Date(a.date) - new Date(b.date));
                setCachedData(symbol, historicalData);
              }
            }
          }

          if (historicalData && historicalData.length >= 2) {
            const latestDay = historicalData[historicalData.length - 1];
            const prevDay = historicalData[historicalData.length - 2];
            let currentPrice, previousClose, dayOpen, dayHigh, dayLow, dayVolume;
            if (realTimeData) {
              currentPrice = realTimeData.currentPrice || realTimeData.close;
              previousClose = realTimeData.previousClose || latestDay.close;
              dayOpen = realTimeData.open || latestDay.open;
              dayHigh = realTimeData.high || latestDay.high;
              dayLow = realTimeData.low || latestDay.low;
              dayVolume = realTimeData.volume || 0;
            } else {
              currentPrice = latestDay.close;
              previousClose = prevDay.close;
              dayOpen = latestDay.open;
              dayHigh = latestDay.high;
              dayLow = latestDay.low;
              dayVolume = latestDay.volume;
            }
            const change = currentPrice - previousClose;
            const changePercent = (change / previousClose) * 100;
            setQuote({
              c: currentPrice,
              o: dayOpen,
              h: dayHigh,
              l: dayLow,
              pc: previousClose,
              d: change,
              dp: changePercent,
              todayBars: {
                open: dayOpen,
                high: dayHigh,
                low: dayLow,
                close: currentPrice,
                volume: dayVolume,
                isOfficial: realTimeData?.source === 'yahoo'
              }
            });
          }

          try {
            const metricsRes = await fetch(`${WORKER_URL}/finnhub/metric/${symbol}`);
            const metricsData = await metricsRes.json();
            if (metricsData?.metric) setMetrics(metricsData);
          } catch (e) { console.error('Finnhub metrics failed:', e); }

          if (historicalData?.length > 0) setData(historicalData);
        } catch (error) { console.error('Error:', error); }
        setLoading(false);
      };

      const updatePriceOnly = async (symbol) => {
        try {
          const realTimeData = await fetchRealTimePrice(symbol);
          
          if (realTimeData && data.length > 0) {
            const currentPrice = realTimeData.currentPrice || realTimeData.close;
            
            // Check if price actually changed
            if (lastPriceRef.current !== null && lastPriceRef.current === currentPrice) {
              return;
            }
            
            lastPriceRef.current = currentPrice;
            
            setPriceUpdating(true);
            const previousClose = realTimeData.previousClose || data[data.length - 1].close;
            const change = currentPrice - previousClose;
            const changePercent = (change / previousClose) * 100;
            const dayOpen = realTimeData.open || data[data.length - 1].open;
            const dayHigh = realTimeData.high || data[data.length - 1].high;
            const dayLow = realTimeData.low || data[data.length - 1].low;
            setQuote({
              c: currentPrice,
              o: dayOpen,
              h: dayHigh,
              l: dayLow,
              pc: previousClose,
              d: change,
              dp: changePercent,
              todayBars: {
                open: dayOpen,
                high: dayHigh,
                low: dayLow,
                close: currentPrice,
                volume: realTimeData.volume || 0
              }
            });
            if (realTimeData.yahooData) setYahooData(realTimeData.yahooData);
            
            // If user is viewing 1D chart, refresh it with live data
            if (timeframe === '1D') {
              fetchChartData(symbol, '1D');
            }
            
            setTimeout(() => setPriceUpdating(false), 300);
          }
        } catch (error) {
          console.error('Error updating price:', error);
        }
      };

      const fetchChartData = async (symbol, tf) => {
        setHoverData(null); // Reset hover when timeframe changes
        try {
          // Strategy 1: Use existing 6M data for smaller timeframes (instant)
          if (['1M', '3M', '6M'].includes(tf) && data.length > 0) {
            const monthsMap = { '1M': 1, '3M': 3, '6M': 6 };
            const months = monthsMap[tf];
            const cutoffDate = new Date();
            cutoffDate.setMonth(cutoffDate.getMonth() - months);
            
            const filtered = data.filter(d => new Date(d.date) >= cutoffDate);
            setChartData(filtered);
            console.log(`Using cached 6M data filtered to ${tf} (${filtered.length} points)`);
            return;
          }
          
          // Strategy 2: Check cache for special timeframes (1D, 1W, YTD, 1Y, 5Y)
          // Exception: Always refetch 1D if market is open (for live updates)
          const cacheKey = `${symbol}-${tf}`;
          const marketOpen = isMarketOpen();
          
          if (!marketOpen && chartCache[cacheKey]) {
            setChartData(chartCache[cacheKey]);
            return;
          }
          
          // Strategy 3: Fetch from API
          setChartUpdating(true);
          
          let rangeParam = '6mo';
          let intervalParam = '1d';
          switch(tf) {
            case '1D': rangeParam = '1d'; intervalParam = '5m'; break;
            case '1W': rangeParam = '5d'; intervalParam = '15m'; break;
            case '1M': rangeParam = '1mo'; intervalParam = '1d'; break;
            case '3M': rangeParam = '3mo'; intervalParam = '1d'; break;
            case '6M': rangeParam = '6mo'; intervalParam = '1d'; break;
            case 'YTD': rangeParam = 'ytd'; intervalParam = '1d'; break;
            case '1Y': rangeParam = '1y'; intervalParam = '1d'; break;
            case '5Y': rangeParam = '5y'; intervalParam = '1d'; break;
          }
          
          console.log(`Fetching chart data ${tf}...`);
          const barsRes = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=${rangeParam}&interval=${intervalParam}`);
          const barsData = await barsRes.json();
          
          if (barsData?.chart?.result?.[0]) {
            const result = barsData.chart.result[0];
            const timestamps = result.timestamp;
            const quote = result.indicators.quote[0];
            if (timestamps && quote) {
              const chartBars = timestamps.map((t, i) => ({
                date: new Date(t * 1000).toISOString(),
                open: quote.open[i],
                high: quote.high[i],
                low: quote.low[i],
                close: quote.close[i],
                volume: quote.volume[i] || 0
              })).filter(b => b.close !== null);
              
              setChartData(chartBars);
              
              // Cache the result (except 1D during market hours - it needs to stay fresh)
              if (tf !== '1D' || !marketOpen) {
                setChartCache(prev => ({ ...prev, [cacheKey]: chartBars }));
                console.log(`Cached ${tf} data (${chartBars.length} points)`);
              }
            }
          }
          
          setTimeout(() => setChartUpdating(false), 300);
        } catch (error) { 
          console.error('Error fetching chart data:', error);
          setChartUpdating(false);
        }
      };

      useEffect(() => { 
        setChartCache({}); // Clear cache when changing ticker
        lastPriceRef.current = null; // Reset last price tracking
        fetchStockData(ticker); 
      }, [ticker]);
      useEffect(() => { if (ticker) fetchChartData(ticker, timeframe); }, [ticker, timeframe]);
      
      // WebSocket connection for real-time prices (ONLY during regular market hours 9:30am-4pm EST)
      useEffect(() => {
        if (FINNHUB_API_KEY === 'YOUR_FINNHUB_API_KEY') {
          console.log('⚠️ Finnhub API key not set - WebSocket disabled');
          return;
        }
        
        // Only connect during regular market hours
        const checkMarketHours = () => {
          const now = new Date();
          const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
          const day = estTime.getDay();
          const hour = estTime.getHours();
          const minute = estTime.getMinutes();
          const timeInMinutes = hour * 60 + minute;
          const marketOpen = 9 * 60 + 30; // 9:30 AM
          const marketClose = 16 * 60; // 4:00 PM
          
          // Weekday and between 9:30am-4pm EST
          return day !== 0 && day !== 6 && timeInMinutes >= marketOpen && timeInMinutes < marketClose;
        };
        
        let ws = null;
        let reconnectTimeout = null;
        
        const connectWebSocket = () => {
          if (!checkMarketHours()) {
            console.log('Market closed - WebSocket not connecting');
            return;
          }
          
          ws = new WebSocket(`wss://ws.finnhub.io?token=${FINNHUB_API_KEY}`);
          wsRef.current = ws;
          
          ws.onopen = () => {
            console.log('✓ Finnhub WebSocket connected (market hours)');
            setWsConnected(true);
            if (ticker) {
              ws.send(JSON.stringify({ type: 'subscribe', symbol: ticker }));
              currentSymbolRef.current = ticker;
              console.log(`✓ Subscribed to ${ticker}`);
            }
          };
          
          ws.onmessage = (event) => {
            // Double-check we're still in market hours before updating price
            if (!checkMarketHours()) return;
            
            const message = JSON.parse(event.data);
            
            if (message.type === 'trade' && message.data && message.data.length > 0) {
              // Use ref instead of ticker to avoid stale closure
              const currentSymbol = currentSymbolRef.current;
              const trades = message.data.filter(t => t.s === currentSymbol);
              if (trades.length > 0) {
                const latestTrade = trades[trades.length - 1];
                const newPrice = latestTrade.p;
                
                if (lastPriceRef.current !== newPrice) {
                  lastPriceRef.current = newPrice;
                  
                  // Only update price and change - leave OHLV data from Yahoo intact
                  setQuote(prev => {
                    if (!prev) return prev;
                    const change = newPrice - prev.pc;
                    const changePercent = (change / prev.pc) * 100;
                    return {
                      ...prev,
                      c: newPrice,
                      d: change,
                      dp: changePercent
                      // Do NOT update h, l, o, or todayBars - those come from Yahoo
                    };
                  });
                  
                  // Update 1D chart with latest price point
                  setChartData(prev => {
                    if (!prev || prev.length === 0) return prev;
                    // Only update if viewing intraday chart
                    const lastPoint = prev[prev.length - 1];
                    const now = new Date();
                    const lastPointTime = new Date(lastPoint.date);
                    // If less than 5 minutes since last point, update it; otherwise this will refresh on next Yahoo fetch
                    if ((now - lastPointTime) < 5 * 60 * 1000) {
                      const updated = [...prev];
                      updated[updated.length - 1] = {
                        ...lastPoint,
                        close: newPrice,
                        high: Math.max(lastPoint.high, newPrice),
                        low: Math.min(lastPoint.low, newPrice)
                      };
                      return updated;
                    }
                    return prev;
                  });
                }
              }
            }
          };
          
          ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            setWsConnected(false);
          };
          
          ws.onclose = () => {
            setWsConnected(false);
            wsRef.current = null;
            // Only reconnect if still market hours
            if (checkMarketHours()) {
              console.log('WebSocket disconnected, reconnecting in 3s...');
              reconnectTimeout = setTimeout(connectWebSocket, 3000);
            } else {
              console.log('WebSocket closed - market now closed');
            }
          };
        };
        
        // Initial connection if market is open
        if (checkMarketHours()) {
          connectWebSocket();
        }
        
        // Check every minute if market just opened (for pages left open overnight)
        const marketCheckInterval = setInterval(() => {
          const isOpen = checkMarketHours();
          const hasConnection = wsRef.current && wsRef.current.readyState === WebSocket.OPEN;
          
          if (isOpen && !hasConnection) {
            console.log('Market just opened - connecting WebSocket');
            connectWebSocket();
          } else if (!isOpen && hasConnection) {
            console.log('Market just closed - disconnecting WebSocket');
            wsRef.current.close();
          }
        }, 60000);
        
        return () => {
          clearInterval(marketCheckInterval);
          if (reconnectTimeout) clearTimeout(reconnectTimeout);
          if (wsRef.current) {
            if (currentSymbolRef.current && wsRef.current.readyState === WebSocket.OPEN) {
              wsRef.current.send(JSON.stringify({ type: 'unsubscribe', symbol: currentSymbolRef.current }));
            }
            wsRef.current.close();
            wsRef.current = null;
          }
        };
      }, []);
      
      // Handle ticker changes - update WebSocket subscription
      useEffect(() => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          if (currentSymbolRef.current && currentSymbolRef.current !== ticker) {
            wsRef.current.send(JSON.stringify({ type: 'unsubscribe', symbol: currentSymbolRef.current }));
            console.log(`✓ Unsubscribed from ${currentSymbolRef.current}`);
          }
          wsRef.current.send(JSON.stringify({ type: 'subscribe', symbol: ticker }));
          currentSymbolRef.current = ticker;
          console.log(`✓ Subscribed to ${ticker}`);
        }
      }, [ticker]);
      
      // Periodic refresh for 1D chart (fetches new bars from Yahoo every 60 seconds)
      useEffect(() => {
        if (timeframe !== '1D') return;
        if (!isMarketOpen()) return;
        
        const refreshChart = async () => {
          try {
            const barsRes = await fetch(`${WORKER_URL}/yahoo/${ticker}?range=1d&interval=5m`);
            const barsData = await barsRes.json();
            
            if (barsData?.chart?.result?.[0]) {
              const result = barsData.chart.result[0];
              const timestamps = result.timestamp;
              const quote = result.indicators.quote[0];
              if (timestamps && quote) {
                const chartBars = timestamps.map((t, i) => ({
                  date: new Date(t * 1000).toISOString(),
                  open: quote.open[i],
                  high: quote.high[i],
                  low: quote.low[i],
                  close: quote.close[i],
                  volume: quote.volume[i] || 0
                })).filter(b => b.close !== null);
                
                setChartData(chartBars);
                console.log(`✓ Refreshed 1D chart (${chartBars.length} bars)`);
              }
            }
          } catch (error) {
            console.error('Chart refresh failed:', error);
          }
        };
        
        // Refresh every 60 seconds
        const interval = setInterval(refreshChart, 60000);
        
        return () => clearInterval(interval);
      }, [ticker, timeframe]);

      // Handle Mouse Move over Graph
      const handleGraphHover = (e) => {
        if (!chartData || chartData.length === 0 || !svgRef.current) return;
        
        const svgRect = svgRef.current.getBoundingClientRect();
        
        // Calculate scaling factor between Screen Pixels and SVG viewBox units (800 width)
        const scaleX = 800 / svgRect.width;
        
        // Get Mouse X in SVG Coordinates
        let mouseX = (e.clientX - svgRect.left) * scaleX;
        
        // Chart Area Constants (SVG Units)
        const CHART_START_X = 50;
        const CHART_WIDTH = 720;
        
        // Clamp MouseX
        if (mouseX < CHART_START_X) mouseX = CHART_START_X;
        if (mouseX > CHART_START_X + CHART_WIDTH) mouseX = CHART_START_X + CHART_WIDTH;

        let index, dataX;
        
        if (timeframe === '1D') {
          // For 1D: Map mouse position to time, then find nearest data point
          const chartStartHour = 9.5; // 9:30am
          const chartEndHour = 16; // 4pm
          const totalHours = chartEndHour - chartStartHour;
          
          // Convert mouse X to time
          const mouseTimeHours = chartStartHour + ((mouseX - CHART_START_X) / CHART_WIDTH) * totalHours;
          
          // Find nearest data point by time
          let nearestIndex = 0;
          let nearestDiff = Infinity;
          
          chartData.forEach((d, i) => {
            const date = new Date(d.date);
            const estTime = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
            const hours = estTime.getHours();
            const minutes = estTime.getMinutes();
            const timeInHours = hours + minutes / 60;
            
            const diff = Math.abs(timeInHours - mouseTimeHours);
            if (diff < nearestDiff) {
              nearestDiff = diff;
              nearestIndex = i;
            }
          });
          
          index = nearestIndex;
          
          // Calculate actual X position based on data point's time
          const point = chartData[index];
          const date = new Date(point.date);
          const estTime = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
          const hours = estTime.getHours();
          const minutes = estTime.getMinutes();
          const timeInHours = hours + minutes / 60;
          const clampedTime = Math.max(chartStartHour, Math.min(chartEndHour, timeInHours));
          dataX = CHART_START_X + ((clampedTime - chartStartHour) / totalHours) * CHART_WIDTH;
        } else {
          // For other timeframes: Map Mouse X to Nearest Data Index (evenly distributed)
          const ratio = (mouseX - CHART_START_X) / CHART_WIDTH;
          index = Math.round(ratio * (chartData.length - 1));
          dataX = CHART_START_X + (index / (chartData.length - 1)) * CHART_WIDTH;
        }
        
        if (index >= 0 && index < chartData.length) {
          const point = chartData[index];
          
          // Calculate Y position for the point
          const minP = minPrice;
          const rangeP = priceRange;
          const yPos = 260 - ((point.close - minP) / rangeP) * 240;

          setHoverData({
            mouseX: dataX,   // Snap vertical line to data point (Google Style)
            dataX: dataX,    // Snap dot to data point
            y: yPos,
            data: point
          });
        }
      };

      const handleGraphLeave = () => {
        setHoverData(null);
      };

      const dataWithToday = [...data];
      const tradingDay = getTradingDay();
      const lastDate = data.length > 0 ? data[data.length - 1].date : null;
      const hasTodayData = lastDate === tradingDay;
      const hasManualTodayRow = dataWithToday.some(d => d.date === tradingDay && d.isToday);
      
      // Check if current time is weekend in EST
      const now = new Date();
      const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      const dayOfWeek = estTime.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      
      // Also check if tradingDay itself is a weekend date
      const tradingDayDate = new Date(tradingDay + 'T12:00:00');
      const tradingDayOfWeek = tradingDayDate.getDay();
      const isTradingDayWeekend = tradingDayOfWeek === 0 || tradingDayOfWeek === 6;
      
      // If today's data exists in historical data, update it with live data
      if (!isWeekend && !isTradingDayWeekend && hasTodayData && quote?.c) {
        const todayIndex = dataWithToday.findIndex(d => d.date === tradingDay);
        if (todayIndex !== -1) {
          const isLiveData = isMarketOpen();
          // Use Yahoo data for spreadsheet if available, otherwise use quote data
          const useYahoo = yahooData?.spreadsheetOpen;
          dataWithToday[todayIndex] = {
            ...dataWithToday[todayIndex],
            open: useYahoo ? yahooData.spreadsheetOpen : (quote.o || dataWithToday[todayIndex].open),
            high: useYahoo ? yahooData.spreadsheetHigh : (quote.h || dataWithToday[todayIndex].high),
            low: useYahoo ? yahooData.spreadsheetLow : (quote.l || dataWithToday[todayIndex].low),
            close: quote.c,
            volume: useYahoo ? yahooData.spreadsheetVolume : (quote.todayBars?.volume || dataWithToday[todayIndex].volume),
            isToday: isLiveData
          };
        }
      }
      
      // If today's data doesn't exist, add it
      if (!isWeekend && !isTradingDayWeekend && !hasTodayData && !hasManualTodayRow && quote?.c) {

        const useYahoo = yahooData?.spreadsheetOpen;
        dataWithToday.push({
          date: tradingDay,
          open: useYahoo ? yahooData.spreadsheetOpen : (quote.o || quote.c),
          high: useYahoo ? yahooData.spreadsheetHigh : (quote.h || quote.c),
          low: useYahoo ? yahooData.spreadsheetLow : (quote.l || quote.c),
          close: quote.c,
          volume: useYahoo ? yahooData.spreadsheetVolume : (quote.todayBars?.volume || 0),
          isToday: isLiveData
        });
      }
      const cleanedData = dataWithToday.filter(d => {
        if (d.isToday && d.date !== tradingDay) return false;
        return true;
      });
      
      // Add change values to each row for sorting
      const dataWithChange = cleanedData.map((row, index) => {
        if (index === 0) {
          return { ...row, chg: null };
        }
        const prevRow = cleanedData[index - 1];
        return { ...row, chg: row.close - prevRow.close };
      });
      
      // Calculate today's change from chronological data (before sorting)
      let todayChange = 0;
      let todayChangePercent = 0;
      if (dataWithChange.length >= 2) {
        const todayRow = dataWithChange[dataWithChange.length - 1];
        const yesterdayRow = dataWithChange[dataWithChange.length - 2];
        if (todayRow && yesterdayRow) {
          todayChange = todayRow.close - yesterdayRow.close;
          todayChangePercent = (todayChange / yesterdayRow.close) * 100;
        }
      }
      
      const sortedData = [...dataWithChange].sort((a, b) => {
        if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
        if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });

      const currentPrice = quote?.c || data[data.length - 1]?.close || 0;
      const priceChange = todayChange;
      const priceChangePercent = todayChangePercent;
      const dayHigh = quote?.h || data[data.length - 1]?.high || 0;
      const dayLow = quote?.l || data[data.length - 1]?.low || 0;
      const highestPrice = data.length > 0 ? Math.max(...data.map(d => d.high)) : 0;
      const lowestPrice = data.length > 0 ? Math.min(...data.map(d => d.low)) : 0;
      const avgVolume = data.length > 0 ? data.reduce((sum, d) => sum + d.volume, 0) / data.length : 0;
      const week52High = metrics?.metric?.['52WeekHigh'] || highestPrice;
      const week52Low = metrics?.metric?.['52WeekLow'] || lowestPrice;
      const marketCap = metrics?.metric?.marketCapitalization || 0;
      const forwardPE = metrics?.metric?.forwardPE || 0;

      const handleTickerSubmit = (e) => {
        e.preventDefault();
        if (inputTicker.trim()) {
          setTicker(inputTicker.toUpperCase());
          setInputTicker('');
          setSharesCount('');
        }
      };

      const handleSort = (key) => {
        setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
      };

      // Chart Calculations - recalculate when chartData changes
      const { minPrice, maxPrice, priceRange, getY, linePath, areaPath } = useMemo(() => {
        const min = chartData.length > 0 ? Math.min(...chartData.map(d => d.low)) * 0.999 : 0;
        const max = chartData.length > 0 ? Math.max(...chartData.map(d => d.high)) * 1.001 : 100;
        const range = (max - min) || 1;
        const calcY = (price) => 260 - ((price - min) / range) * 240;
        
        // For 1D, map data points to fixed 9:30am-4pm time scale
        const calcX = (d, i) => {
          if (timeframe === '1D' && chartData.length > 0) {
            const date = new Date(d.date);
            // Get hours and minutes in EST
            const estTime = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
            const hours = estTime.getHours();
            const minutes = estTime.getMinutes();
            const timeInHours = hours + minutes / 60;
            
            // Map 9:30am (9.5) to 4pm (16) onto chart width (50 to 770)
            const chartStartHour = 9.5;
            const chartEndHour = 16;
            const totalHours = chartEndHour - chartStartHour;
            
            // Clamp to chart bounds
            const clampedTime = Math.max(chartStartHour, Math.min(chartEndHour, timeInHours));
            const x = 50 + ((clampedTime - chartStartHour) / totalHours) * 720;
            return x;
          }
          // Default: evenly distributed
          return 50 + (i / (chartData.length - 1 || 1)) * 720;
        };
        
        const line = chartData.length > 1 ? chartData.map((d, i) => `${i === 0 ? 'M' : 'L'} ${calcX(d, i)} ${calcY(d.close)}`).join(' ') : '';
        const area = line ? `${line} L ${calcX(chartData[chartData.length - 1], chartData.length - 1)} 260 L ${calcX(chartData[0], 0)} 260 Z` : '';
        
        return {
          minPrice: min,
          maxPrice: max,
          priceRange: range,
          getY: calcY,
          calcX: calcX,
          linePath: line,
          areaPath: area
        };
      }, [chartData, timeframe]);

      // Chart Color Logic (Google Style)
      // For 1D: Compare Current vs Prev Close
      // For >1D: Compare Last Point vs First Point
      let isChartPositive = true;
      if (timeframe === '1D') {
         // Use Previous Close from Quote if available, otherwise fallback to first bar
         const baseline = quote?.pc || (chartData.length > 0 ? chartData[0].close : 0);
         const current = chartData.length > 0 ? chartData[chartData.length - 1].close : 0;
         isChartPositive = current >= baseline;
      } else {
         if (chartData.length > 0) {
           isChartPositive = chartData[chartData.length - 1].close >= chartData[0].close;
         }
      }

      const CHART_COLOR = isChartPositive ? '#137333' : '#a50e0e'; // Google Green / Red
      const CHART_FILL_TOP = isChartPositive ? 'rgba(19, 115, 51, 0.2)' : 'rgba(165, 14, 14, 0.2)';
      const CHART_FILL_BOTTOM = isChartPositive ? 'rgba(19, 115, 51, 0.0)' : 'rgba(165, 14, 14, 0.0)';

      return (
        <div style={{ minHeight: '100vh', background: '#f4f1e8', fontFamily: '"IBM Plex Mono", monospace', color: '#1a1a1a', padding: '22px' }}> 
          <style>{`

            .ticker-input:focus { outline: none; background: rgba(0,0,0,0.05); }
            .top-row { display: flex; gap: 20px; margin-bottom: 0; margin-top: 20px; }

            .top-row .chart-wrapper { flex: 1; display: flex; flex-direction: column; }
            .top-row .chart-wrapper .section-label { margin-top: 0; }

            .price-current.flash { filter: brightness(1.4); }
            .price-change { font-size: 16px; font-weight: 500; transition: filter 0.3s ease; margin-top: 8px; }
            .price-change.flash { filter: brightness(1.3); }

            @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
            .timestamp { font-size: 11px; color: #888; text-align: right; margin-top: 14px; letter-spacing: 1px; }
            
            @media (max-width: 900px) {
              .top-row { flex-direction: column; }

              .price-current { font-size: 44px; }

              .price-section { padding: 28px 32px; }

          {loading && <div className="loading"><div className="loading-text">Loading {ticker}...</div></div>}

          <div className="container">

              <div className="ticker-display">{companyName || ticker}</div>
              <form className="ticker-form" onSubmit={handleTickerSubmit}>
                <input type="text" className="ticker-input" value={inputTicker} onChange={(e) => setInputTicker(e.target.value)} placeholder="TICKER" maxLength={5} />
              </form>
            </header>

            <div className="top-row">
              <div className="price-section box">
                <div className="price-main">
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', width: '100%'}}>
                    <div style={{display: 'flex', flexDirection: 'column'}}>
                      <span className={`price-current ${priceUpdating ? 'flash' : ''}`} style={{ color: '#1a1a1a' }}>${currentPrice.toFixed(2)}</span>
                      <span className={`price-change ${priceChange >= 0 ? 'positive' : 'negative'} ${priceUpdating ? 'flash' : ''}`}>
                        {priceChange >= 0 ? '+' : ''}{priceChange.toFixed(2)} ({priceChange >= 0 ? '+' : ''}{priceChangePercent.toFixed(2)}%)
                      </span>
                    </div>
                    <div className={`status-dot ${isMarketOpen() ? 'open' : 'closed'}`}></div>
                  </div>
                </div>
                
                {/* Pre/Post Market Bar */}
                {!isMarketOpen() && yahooData && (
                  (() => {
                    let marketLabel, marketPrice, marketChange, marketChangePercent;
                    
                    // Determine if we're in pre-market or post-market based on time
                    const now = new Date();
                    const estTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
                    const estHour = estTime.getHours();
                    const estMinute = estTime.getMinutes();
                    const timeInMinutes = estHour * 60 + estMinute;
                    const preMarketStart = 4 * 60; // 4:00 AM
                    const marketOpen = 9 * 60 + 30; // 9:30 AM
                    const marketClose = 16 * 60; // 4:00 PM
                    const postMarketEnd = 20 * 60; // 8:00 PM
                    
                    const isPreMarketTime = timeInMinutes >= preMarketStart && timeInMinutes < marketOpen;
                    const isPostMarketTime = timeInMinutes >= marketClose && timeInMinutes < postMarketEnd;
                    
                    // Use time-based logic first, then fall back to what data exists
                    if (isPreMarketTime && yahooData.preMarketPrice) {
                      marketLabel = 'PRE';
                      marketPrice = yahooData.preMarketPrice;
                      marketChange = marketPrice - currentPrice;
                      marketChangePercent = (marketChange / currentPrice) * 100;
                    } else if (isPostMarketTime && yahooData.postMarketPrice) {

                      marketChangePercent = (marketChange / currentPrice) * 100;
                    } else if (yahooData.postMarketPrice) {

                      marketChange = marketPrice - currentPrice;
                      marketChangePercent = (marketChange / currentPrice) * 100;

                      marketPrice = yahooData.currentPrice;

                    const isPositive = marketChange >= 0;
                    return (
                      <div style={{

                          {isPositive ? '+' : ''}${marketChange.toFixed(2)} ({isPositive ? '+' : ''}{marketChangePercent.toFixed(2)}%)
                        </span>
                      </div>
                    );
                  })()
                )}
                
                <hr style={{margin: '16px 0', border: 'none', borderTop: '1px solid #e8e5dc'}} />
                <div className="stats-grid">
                  <div className="stat-row"><span className="stat-label">Day Range</span><span className="stat-value">{dayLow.toFixed(2)} - {dayHigh.toFixed(2)}</span></div>
                  <div className="stat-row"><span className="stat-label">52 Week Range</span><span className="stat-value">{week52Low.toFixed(2)} - {week52High.toFixed(2)}</span></div>
                  <div className="stat-row"><span className="stat-label">Avg. Volume</span><span className="stat-value">{Math.floor(avgVolume).toLocaleString()}</span></div>
                  <div className="stat-row"><span className="stat-label">Market Cap</span><span className="stat-value">{(() => {
                    if (marketCap <= 0) return 'N/A';
                    const inBillions = marketCap / 1000;
                    const inTrillions = marketCap / 1000000;
                    if (inTrillions >= 1) return inTrillions.toPrecision(3) + 'T';
                    if (inBillions >= 1) return inBillions.toPrecision(3) + 'B';
                    return marketCap.toPrecision(3) + 'M';
                  })()}</span></div>
                  <div className="stat-row"><span className="stat-label">Forward P/E</span><span className="stat-value">{forwardPE > 0 ? forwardPE.toFixed(2) : 'N/A'}</span></div>
                </div>
              </div>
              
              <div className="chart-wrapper">
                <div className="box chart-box">
                  <div className="timeframe-controls">
                    {['1D', '1W', '1M', '3M', '6M', 'YTD', '1Y', '5Y'].map(tf => (
                      <button 
                        key={tf} 
                        className={`timeframe-btn ${timeframe === tf ? 'active' : ''}`}
                        onClick={() => setTimeframe(tf)}
                      >
                        {tf}
                      </button>
                    ))}
                  </div>
                  
                  <svg 
                    ref={svgRef}
                    viewBox="0 0 800 300" 
                    preserveAspectRatio="none"
                    style={{ width: '100%', height: '100%', cursor: 'crosshair' }}
                    onMouseMove={handleGraphHover}
                    onMouseLeave={handleGraphLeave}
                  >
                    <defs>
                      <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stopColor={CHART_FILL_TOP} />
                        <stop offset="100%" stopColor={CHART_FILL_BOTTOM} />
                      </linearGradient>
                    </defs>
                    
                    {/* Y Axis Grid Lines */}
                    {(() => {
                      const min = Math.floor(minPrice / 20) * 20;
                      const max = Math.ceil(maxPrice / 20) * 20;
                      const range = max - min;
                      const step = Math.ceil(range / 5 / 20) * 20;
                      const steps = [];
                      for (let p = max; p >= min && steps.length < 6; p -= step) steps.push(p);
                      return steps.map(p => <text key={p} x="8" y={20 + ((max - p) / (max - min || 1)) * 240 + 4} fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">${p}</text>);
                    })()}
                    
                    {/* Chart Area and Line */}
                    {areaPath && <path d={areaPath} fill="url(#grad)" />}
                    {linePath && <path d={linePath} fill="none" stroke={CHART_COLOR} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
                    
                    {/* X Axis Labels */}
                    {(() => {
                      if (chartData.length === 0) return null;
                      
                      if (timeframe === '1D') {
                        // Fixed time labels from 9:30am to 4pm EST (market hours)
                        const fixedTimes = ['9:30', '10:30', '11:30', '12:30', '1:30', '2:30', '3:30'];
                        const chartStartHour = 9.5; // 9:30am
                        const chartEndHour = 16; // 4pm
                        const totalHours = chartEndHour - chartStartHour; // 6.5 hours
                        
                        return fixedTimes.map((label, idx) => {
                          // Calculate x position based on fixed time slots (1 hour apart)
                          const hourOffset = idx;
                          const x = 50 + (hourOffset / totalHours) * 720;
                          return (
                            <text key={idx} x={x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">{label}</text>
                          );
                        });
                      }
                      
                      if (timeframe === '1W') {
                        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                        const dayPoints = [];
                        const seen = new Set();
                        chartData.forEach((d, i) => {
                          const day = new Date(d.date).getDay();
                          const date = new Date(d.date).toDateString();
                          if (!seen.has(date)) {
                            seen.add(date);
                            dayPoints.push({ label: days[day], x: 50 + (i / (chartData.length - 1 || 1)) * 720 });
                          }
                        });
                        return dayPoints.map((p, idx) => (
                          <text key={idx} x={p.x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">{p.label}</text>
                        ));
                      }
                      
                      if (timeframe === '5Y') {
                        const yearPoints = [];
                        const seen = new Set();
                        chartData.forEach((d, i) => {
                          const year = new Date(d.date).getFullYear().toString().slice(-2);
                          const fullYear = new Date(d.date).getFullYear();
                          if (!seen.has(fullYear)) {
                            seen.add(fullYear);
                            yearPoints.push({ label: year, x: 50 + (i / (chartData.length - 1 || 1)) * 720 });
                          }
                        });
                        return yearPoints.map((p, idx) => (
                          <text key={idx} x={p.x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">{p.label}</text>
                        ));
                      }
                      
                      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                      const seen = new Set();
                      const monthPoints = [];
                      chartData.forEach((d, i) => {
                        const m = new Date(d.date).getMonth();
                        const key = `${new Date(d.date).getFullYear()}-${m}`;
                        if (!seen.has(key)) {
                          seen.add(key);
                          monthPoints.push({ month: months[m], x: 50 + (i / (chartData.length - 1 || 1)) * 720 });
                        }
                      });
                      return monthPoints.map(p => (
                        <text key={p.month + p.x} x={p.x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">{p.month}</text>
                      ));
                    })()}
                    
                    {/* Hover Overlays */}
                    {hoverData && (
                      <g pointerEvents="none">
                        {/* Vertical Line - Snapped to Data */}
                        <line 
                          x1={hoverData.dataX} 
                          y1="20" 
                          x2={hoverData.dataX} 
                          y2="260" 
                          stroke="#666" 
                          strokeWidth="1" 
                          strokeDasharray="4"
                        />
                        {/* Horizontal Line - Snapped to Data Y */}
                        <line 
                          x1="50" 
                          y1={hoverData.y} 
                          x2="770" 
                          y2={hoverData.y} 
                          stroke="#666" 
                          strokeWidth="1" 
                          strokeDasharray="4"
                        />
                         {/* Circle Intersection - Snaps to Data Point */}
                         <circle 
                          cx={hoverData.dataX} 
                          cy={hoverData.y} 
                          r="3.5" 
                          fill={CHART_COLOR} 
                          stroke="#fff" 
                          strokeWidth="2" 
                        />
                      </g>
                    )}
                  </svg>
                  
                  {/* Fixed-size HTML Tooltip */}
                  {hoverData && (
                    <div style={{
                      position: 'absolute',
                      left: `${(hoverData.dataX / 800) * 100}%`,
                      top: `${(hoverData.y / 300) * 100}%`,
                      transform: hoverData.dataX < 400 ? 'translate(10px, -50%)' : 'translate(-130px, -50%)',
                      pointerEvents: 'none',
                      zIndex: 10
                    }}>
                      <div style={{
                        background: 'rgba(26, 26, 26, 0.9)',
                        padding: '8px 12px',
                        borderRadius: '4px',
                        minWidth: '120px',
                        textAlign: 'center'
                      }}>
                        <div style={{
                          color: '#fff',
                          fontSize: '13px',
                          fontWeight: 600,
                          fontFamily: 'IBM Plex Mono',
                          marginBottom: '4px'
                        }}>
                          ${hoverData.data.close.toFixed(2)}
                        </div>
                        <div style={{
                          color: '#ccc',
                          fontSize: '10px',
                          fontFamily: 'IBM Plex Mono'
                        }}>
                          {timeframe === '1D' 
                            ? new Date(hoverData.data.date).toLocaleTimeString('en-US', {
                                hour:'numeric', 
                                minute:'2-digit',
                                timeZone: 'America/New_York'
                              })
                            : new Date(hoverData.data.date).toLocaleDateString('en-US', {
                                month:'short', 
                                day:'numeric',
                                timeZone: 'America/New_York'
                              })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="box spreadsheet" style={{marginTop: '20px'}}>
              <div className="spreadsheet-header">
                <div onClick={() => handleSort('date')}>date {sortConfig.key === 'date' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('open')}>open {sortConfig.key === 'open' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('high')}>high {sortConfig.key === 'high' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('close')}>close {sortConfig.key === 'close' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('volume')}>vol {sortConfig.key === 'volume' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('chg')}>chg {sortConfig.key === 'chg' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div className="header-input-cell"><input type="text" className="header-input" value={sharesCount ? parseInt(sharesCount).toLocaleString() : ''} onChange={(e) => { const v = e.target.value.replace(/,/g, ''); if (v === '' || /^\d+$/.test(v)) setSharesCount(v); }} placeholder="#" /></div>
              </div>
              <div className="spreadsheet-body">
                {sortedData.map((row, index) => {
                  const shares = parseInt(sharesCount) || 0;
                  const value = shares > 0 ? Math.round(shares * row.close) : null;
                  const isLivePrice = row.isToday && isMarketOpen();
                  const chg = row.chg;
                  
                  return (
                    <div key={row.date} className="spreadsheet-row">
                      <div className="spreadsheet-cell">{row.date.split('T')[0]}</div>
                      <div className="spreadsheet-cell">${row.open.toFixed(2)}</div>
                      <div className="spreadsheet-cell">${row.high.toFixed(2)}</div>
                      <div className={`spreadsheet-cell ${isLivePrice ? 'live-price' : ''}`}>${row.close.toFixed(2)}</div>
                      <div className="spreadsheet-cell">
                        {row.isToday 
                          ? (row.volume > 500000 ? (row.volume / 1000000).toFixed(0) + 'M' : '—')
                          : (row.volume > 500000 ? (row.volume / 1000000).toFixed(0) + 'M' : '—')
                        }
                      </div>
                      <div className={`spreadsheet-cell ${chg !== null ? (chg >= 0 ? 'positive' : 'negative') : ''}`}>{chg !== null ? `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}` : '—'}</div>
                      <div className="spreadsheet-cell value-cell">{value !== null && <>${value.toLocaleString()}{chg !== null && <span className={chg >= 0 ? 'positive' : 'negative'}> | {chg >= 0 ? '+' : ''}${Math.round(chg * shares).toLocaleString()}</span>}</>}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="timestamp">Last updated: {new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '')}</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StockTracker />);
  </script>
</body>
</html>
