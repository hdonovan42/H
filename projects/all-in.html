<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // API KEYS - don't steal plz
    const FINNHUB_API_KEY = 'd4iuigpr01queuaklek0d4iuigpr01queuaklekg';
    const ALPHA_VANTAGE_KEY = '49AEFIO1PF5Y6HJX';

    // Cache duration: 24 hours
    const CACHE_DURATION = 24 * 60 * 60 * 1000;

    function StockTracker() {
      const [ticker, setTicker] = useState('TSLA');
      const [inputTicker, setInputTicker] = useState('');
      const [data, setData] = useState([]);
      const [quote, setQuote] = useState(null);
      const [metrics, setMetrics] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [sharesCount, setSharesCount] = useState('');

      const getCachedData = (symbol) => {
        const cached = localStorage.getItem(`stock_${symbol}`);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < CACHE_DURATION) {
            console.log('Using cached data for', symbol);
            return data;
          }
        }
        return null;
      };

      const setCachedData = (symbol, data) => {
        localStorage.setItem(`stock_${symbol}`, JSON.stringify({ data, timestamp: Date.now() }));
        console.log('Cached data for', symbol);
      };

      const fetchStockData = async (symbol) => {
        setLoading(true);

        try {
          let historicalData = getCachedData(symbol);

          // Fetch quote from Finnhub
          const quoteRes = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
          const quoteData = await quoteRes.json();
          if (quoteData?.c > 0) setQuote(quoteData);

          // Fetch metrics from Finnhub
          const metricsRes = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${symbol}&metric=all&token=${FINNHUB_API_KEY}`);
          const metricsData = await metricsRes.json();
          if (metricsData?.metric) setMetrics(metricsData);

          // Fetch historical from Alpha Vantage if not cached
          if (!historicalData) {
            console.log('Fetching from Alpha Vantage...');
            const avRes = await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&outputsize=compact&apikey=${ALPHA_VANTAGE_KEY}`);
            const avData = await avRes.json();

            if (avData['Time Series (Daily)']) {
              historicalData = Object.entries(avData['Time Series (Daily)'])
                .map(([date, v]) => ({
                  date,
                  open: parseFloat(v['1. open']),
                  high: parseFloat(v['2. high']),
                  low: parseFloat(v['3. low']),
                  close: parseFloat(v['4. close']),
                  volume: parseInt(v['5. volume'])
                }))
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(-180);
              setCachedData(symbol, historicalData);
            }
          }

          if (historicalData?.length > 0) setData(historicalData);
        } catch (error) {
          console.error('Error:', error);
        }

        setLoading(false);
      };

      useEffect(() => { fetchStockData(ticker); }, [ticker]);

      // Derived values
      const currentPrice = quote?.c || data[data.length - 1]?.close || 0;
      const priceChange = quote?.d || 0;
      const priceChangePercent = quote?.dp || 0;
      const dayHigh = quote?.h || data[data.length - 1]?.high || 0;
      const dayLow = quote?.l || data[data.length - 1]?.low || 0;
      const highestPrice = data.length > 0 ? Math.max(...data.map(d => d.high)) : 0;
      const lowestPrice = data.length > 0 ? Math.min(...data.map(d => d.low)) : 0;
      const avgVolume = data.length > 0 ? data.reduce((sum, d) => sum + d.volume, 0) / data.length : 0;
      const week52High = metrics?.metric?.['52WeekHigh'] || highestPrice;
      const week52Low = metrics?.metric?.['52WeekLow'] || lowestPrice;
      const marketCap = metrics?.metric?.marketCapitalization || 0;
      const forwardPE = metrics?.metric?.forwardPE || 0;

      const handleTickerSubmit = (e) => {
        e.preventDefault();
        if (inputTicker.trim()) {
          setTicker(inputTicker.toUpperCase());
          setInputTicker('');
          setSharesCount('');
        }
      };

      const handleSort = (key) => {
        setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
      };

      const sortedData = [...data].sort((a, b) => {
        if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
        if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });

      // Chart
      const minPrice = data.length > 0 ? Math.min(...data.map(d => d.low)) * 0.98 : 0;
      const maxPrice = data.length > 0 ? Math.max(...data.map(d => d.high)) * 1.02 : 100;
      const priceRange = (maxPrice - minPrice) || 1;
      const getY = (price) => 260 - ((price - minPrice) / priceRange) * 240;
      const linePath = data.length > 1 ? data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${50 + (i / (data.length - 1)) * 720} ${getY(d.close)}`).join(' ') : '';
      const areaPath = linePath ? `${linePath} L ${770} 260 L 50 260 Z` : '';

      return (
        <div style={{ minHeight: '100vh', background: '#f4f1e8', fontFamily: '"IBM Plex Mono", monospace', color: '#1a1a1a', padding: '22px' }}> 
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
            * { box-sizing: border-box; margin: 0; padding: 0; }
            .container { max-width: 1200px; margin: 0 auto; padding: 0px 28px; }
            .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #1a1a1a; }
            .ticker-display { font-size: 44px; font-weight: 600; letter-spacing: -1px; }
            .ticker-form { display: flex; gap: 8px; }
            .ticker-input { background: transparent; border: 2px solid #1a1a1a; padding: 9px 12px; font-family: inherit; font-size: 14px; text-transform: uppercase; width: 90px; letter-spacing: 2px; margin-bottom: 8px;}
            .ticker-input:focus { outline: none; background: rgba(0,0,0,0.05); }
            .top-row { display: flex; gap: 20px; margin-bottom: 0; }
            .top-row .price-section { flex: 0 0 auto; width: 340px; }
            .top-row .chart-wrapper { flex: 1; display: flex; flex-direction: column; }
            .top-row .chart-wrapper .section-label { margin-top: 0; }
            .section-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #666; margin-bottom: 10px; margin-top: 14px; }
            .box { background: #faf9f5; border: 1px solid #d0cdc4; margin-bottom: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 2px 8px rgba(0,0,0,0.08); }
            .price-section { padding: 24px 28px; }
            .price-main { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
            .price-current { font-size: 36px; font-weight: 600; letter-spacing: -1px; }
            .price-change { font-size: 16px; font-weight: 500; }
            .price-subtitle { font-size: 11px; color: #888; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e8e5dc; }
            .stats-grid { display: flex; flex-direction: column; }
            .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ebe8df; }
            .stat-row:last-child { border-bottom: none; }
            .stat-label { font-size: 12px; color: #666; }
            .stat-value { font-size: 12px; font-weight: 500; }
            .chart-box { padding: 16px 12px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
            .spreadsheet { overflow-x: auto; }
            .spreadsheet-header { display: grid; grid-template-columns: 100px 80px 80px 80px 70px 70px auto; background: #e8e5dc; border-bottom: 1px solid #d0cdc4; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
            .spreadsheet-header > div { padding: 10px; border-right: 1px solid #d0cdc4; cursor: pointer; display: flex; align-items: center; justify-content: center; }
            .spreadsheet-header > div:last-child { border-right: none; }
            .spreadsheet-header > div:hover { background: #ddd9d0; }
            .header-input-cell { padding: 6px 10px !important; }
            .header-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #999; font-family: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; padding: 4px 0; text-align: left; }
            .header-input:focus { outline: none; border-bottom-color: #1a1a1a; }
            .header-input::placeholder { color: #999; }
            .sort-indicator { opacity: 0.5; font-size: 10px; margin-left: 4px; }
            .spreadsheet-body { max-height: 300px; overflow-y: auto; }
            .spreadsheet-row { display: grid; grid-template-columns: 100px 80px 80px 80px 70px 70px auto; border-bottom: 1px solid #e8e5dc; }
            .spreadsheet-row:hover { background: #f0ede4; }
            .spreadsheet-cell { padding: 10px; border-right: 1px solid #e8e5dc; font-size: 13px; white-space: nowrap; text-align: center; }
            .spreadsheet-cell:last-child { border-right: none; }
            .value-cell { color: #2d5a3d; font-weight: 500; text-align: left; }
            .positive { color: #2d5a3d; }
            .negative { color: #8b3a3a; }
            .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(244,241,232,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
            .loading-text { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; animation: pulse 1.5s infinite; }
            @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
            .timestamp { font-size: 11px; color: #888; text-align: right; margin-top: 14px; letter-spacing: 1px; }
            
            @media (max-width: 900px) {
              .top-row { flex-direction: column; }
              .top-row .price-section { width: 100%; }
              .price-current { font-size: 44px; }
              .price-change { font-size: 18px; }
              .price-section { padding: 28px 32px; }
              .stat-label, .stat-value { font-size: 13px; }
              .stat-row { padding: 10px 0; }
            }
          `}</style>

          {loading && <div className="loading"><div className="loading-text">Loading {ticker}...</div></div>}

          <div className="container">
            <header className="header">
              <div className="ticker-display">{ticker}</div>
              <form className="ticker-form" onSubmit={handleTickerSubmit}>
                <input type="text" className="ticker-input" value={inputTicker} onChange={(e) => setInputTicker(e.target.value)} placeholder="TICKER" maxLength={5} />
              </form>
            </header>

            <div className="top-row">
              <div className="price-section box">
                <div className="price-main">
                  <span className="price-current">${currentPrice.toFixed(2)}</span>
                  <span className={`price-change ${priceChange >= 0 ? 'positive' : 'negative'}`}>
                    {priceChange >= 0 ? '+' : ''}{priceChange.toFixed(2)} ({priceChange >= 0 ? '+' : ''}{priceChangePercent.toFixed(2)}%)
                  </span>
                </div>
                <div className="price-subtitle">At close: {new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} 4:00 PM EST</div>
                <div className="stats-grid">
                  <div className="stat-row"><span className="stat-label">Day Range</span><span className="stat-value">{dayLow.toFixed(2)} - {dayHigh.toFixed(2)}</span></div>
                  <div className="stat-row"><span className="stat-label">52 Week Range</span><span className="stat-value">{week52Low.toFixed(2)} - {week52High.toFixed(2)}</span></div>
                  <div className="stat-row"><span className="stat-label">Avg. Volume</span><span className="stat-value">{Math.floor(avgVolume).toLocaleString()}</span></div>
                  <div className="stat-row"><span className="stat-label">Market Cap</span><span className="stat-value">{(() => {
                    if (marketCap <= 0) return 'N/A';
                    const inBillions = marketCap / 1000;
                    const inTrillions = marketCap / 1000000;
                    if (inTrillions >= 1) return inTrillions.toPrecision(3) + 'T';
                    if (inBillions >= 1) return inBillions.toPrecision(3) + 'B';
                    return marketCap.toPrecision(3) + 'M';
                  })()}</span></div>
                  <div className="stat-row"><span className="stat-label">Forward P/E</span><span className="stat-value">{forwardPE > 0 ? forwardPE.toFixed(2) : 'N/A'}</span></div>
                </div>
              </div>
              
              <div className="chart-wrapper">
                <div className="box chart-box">
                  <svg viewBox="0 0 800 300" style={{ width: '100%' }}>
                    <defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#1a73e8" stopOpacity="0.3" /><stop offset="100%" stopColor="#1a73e8" stopOpacity="0.02" /></linearGradient></defs>
                    {(() => {
                      const min = Math.floor(minPrice / 20) * 20;
                      const max = Math.ceil(maxPrice / 20) * 20;
                      const range = max - min;
                      const step = Math.ceil(range / 5 / 20) * 20;
                      const steps = [];
                      for (let p = max; p >= min && steps.length < 6; p -= step) steps.push(p);
                      return steps.map(p => <text key={p} x="8" y={20 + ((max - p) / (max - min || 1)) * 240 + 4} fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">${p}</text>);
                    })()}
                    {areaPath && <path d={areaPath} fill="url(#grad)" />}
                    {linePath && <path d={linePath} fill="none" stroke="#1a73e8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
                    {(() => {
                      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], seen = new Set();
                      const monthPoints = [];
                      data.forEach((d, i) => {
                        const m = new Date(d.date).getMonth(), key = `${new Date(d.date).getFullYear()}-${m}`;
                        if (!seen.has(key)) {
                          seen.add(key);
                          monthPoints.push({ month: months[m], x: 50 + (i / (data.length - 1 || 1)) * 720 });
                        }
                      });
                      return monthPoints.filter((p, i) => i === 0 ? p.x > 70 : true).map(p => (
                        <text key={p.month + p.x} x={p.x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">{p.month}</text>
                      ));
                    })()}
                  </svg>
                </div>
              </div>
            </div>

            <div className="section-label">Historical Data — 6 Months</div>
            <div className="box spreadsheet">
              <div className="spreadsheet-header">
                <div onClick={() => handleSort('date')}>date {sortConfig.key === 'date' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('open')}>open {sortConfig.key === 'open' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('high')}>high {sortConfig.key === 'high' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('close')}>close {sortConfig.key === 'close' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('volume')}>vol {sortConfig.key === 'volume' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div>chg</div>
                <div className="header-input-cell"><input type="text" className="header-input" value={sharesCount ? parseInt(sharesCount).toLocaleString() : ''} onChange={(e) => { const v = e.target.value.replace(/,/g, ''); if (v === '' || /^\d+$/.test(v)) setSharesCount(v); }} placeholder="#" /></div>
              </div>
              <div className="spreadsheet-body">
                {sortedData.map((row) => {
                  const shares = parseInt(sharesCount) || 0;
                  const value = shares > 0 ? Math.round(shares * row.close) : null;
                  const idx = data.findIndex(d => d.date === row.date);
                  const prev = idx > 0 ? data[idx - 1].close : null;
                  const chg = prev ? row.close - prev : null;
                  return (
                    <div key={row.date} className="spreadsheet-row">
                      <div className="spreadsheet-cell">{row.date}</div>
                      <div className="spreadsheet-cell">${row.open.toFixed(2)}</div>
                      <div className="spreadsheet-cell">${row.high.toFixed(2)}</div>
                      <div className="spreadsheet-cell">${row.close.toFixed(2)}</div>
                      <div className="spreadsheet-cell">{(row.volume / 1000000).toFixed(1)}M</div>
                      <div className={`spreadsheet-cell ${chg !== null ? (chg >= 0 ? 'positive' : 'negative') : ''}`}>{chg !== null ? `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}` : '—'}</div>
                      <div className="spreadsheet-cell value-cell">{value !== null && <>${value.toLocaleString()}{chg !== null && <span className={chg >= 0 ? 'positive' : 'negative'}> | {chg >= 0 ? '+' : ''}${Math.round(chg * shares).toLocaleString()}</span>}</>}</div>
                    </div>
                  );
                })}
              </div>
            </div>

<div className="timestamp">Last updated: {new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '')}</div>          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StockTracker />);
  </script>
</body>
</html>
