<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Tracker</title>
  <link rel="icon" type="image/png" href="https://hjd.ai/images/H-favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/plugin/utc.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/plugin/timezone.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    
    // Initialize dayjs plugins
    dayjs.extend(dayjs_plugin_utc);
    dayjs.extend(dayjs_plugin_timezone);
    const EST = 'America/New_York';

    const WORKER_URL = 'https://dry-poetry-72b5.donovanh59.workers.dev';
    const CACHE_DURATION = 60 * 60 * 1000;

    /**
     * Fetch shares outstanding from FMP and forward P/E from Finnhub
     * Both cached for 24 hours since they rarely change
     */
    const fetchSharesOutstanding = async (symbol) => {
      const cacheKey = `shares_${symbol}`;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < 24 * 60 * 60 * 1000) {
          return data;
        }
      }
      
      try {
        const [floatRes, finnhubRes] = await Promise.all([
          fetch(`${WORKER_URL}/fmp/shares-float/${symbol}`),
          fetch(`${WORKER_URL}/finnhub/metric/${symbol}`)
        ]);
        
        const floatData = await floatRes.json();
        const finnhubData = await finnhubRes.json();
        
        if (!floatData?.[0]?.outstandingShares) return null;
        
        const result = {
          sharesOutstanding: floatData[0].outstandingShares,
          forwardPE: finnhubData?.metric?.forwardPE || null
        };
        
        localStorage.setItem(cacheKey, JSON.stringify({ data: result, timestamp: Date.now() }));
        
        return result;
      } catch (e) {
        console.error('Fetch error:', e);
        return null;
      }
    };

    // MARKET STATE - Single source of truth for market hours
    const MarketState = {
      PRE_MARKET: 'pre-market',
      OPEN: 'open',
      POST_MARKET: 'post-market',
      CLOSED: 'closed'
    };

    const getMarketState = () => {
      const now = dayjs().tz(EST);
      const day = now.day();
      const timeInMinutes = now.hour() * 60 + now.minute();
      
      const isWeekend = day === 0 || day === 6;
      
      const PRE_MARKET_START = 4 * 60;
      const MARKET_OPEN = 9 * 60 + 30;
      const MARKET_CLOSE = 16 * 60;
      const POST_MARKET_END = 20 * 60;
      
      let state;
      
      if (isWeekend) {
        state = MarketState.CLOSED;
      } else if (timeInMinutes >= MARKET_OPEN && timeInMinutes < MARKET_CLOSE) {
        state = MarketState.OPEN;
      } else if (timeInMinutes >= PRE_MARKET_START && timeInMinutes < MARKET_OPEN) {
        state = MarketState.PRE_MARKET;
      } else if (timeInMinutes >= MARKET_CLOSE && timeInMinutes < POST_MARKET_END) {
        state = MarketState.POST_MARKET;
      } else {
        state = MarketState.CLOSED;
      }
      
      return {
        state,
        estTime: now,
        isWeekend,
        timeInMinutes,
        isRegularHours: state === MarketState.OPEN,
        isExtendedHours: state === MarketState.PRE_MARKET || state === MarketState.POST_MARKET,
        isTradingPossible: state !== MarketState.CLOSED
      };
    };

    const getTodayEST = () => {
      return dayjs().tz(EST).format('YYYY-MM-DD');
    };

    // DATA FETCHING
    const fetchYahooQuote = async (symbol) => {
      // Use 5m interval to get extended hours bars
      const response = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=1d&interval=5m&includePrePost=true`);
      const data = await response.json();
      
      if (!data?.chart?.result?.[0]) return null;
      
      const result = data.chart.result[0];
      const meta = result.meta;
      const quote = result.indicators.quote[0];
      const timestamps = result.timestamp || [];
      const closes = quote.close || [];
      
      const dayHigh = meta.regularMarketDayHigh || quote.high?.[0] || meta.regularMarketPrice;
      const dayLow = meta.regularMarketDayLow || quote.low?.[0] || meta.regularMarketPrice;
      const dayOpen = meta.regularMarketOpen || quote.open?.[0] || meta.previousClose;
      
      // Get extended hours price from the last bar (not meta fields which are unreliable)
      let preMarketPrice = null;
      let postMarketPrice = null;
      
      if (timestamps.length > 0 && closes.length > 0) {
        const lastTimestamp = timestamps[timestamps.length - 1];
        const lastClose = closes[closes.length - 1];
        
        // Convert to EST to check if we're in extended hours
        const lastTime = dayjs.unix(lastTimestamp).tz(EST);
        const hour = lastTime.hour();
        const minute = lastTime.minute();
        const timeInMinutes = hour * 60 + minute;
        
        const PRE_MARKET_START = 4 * 60;      // 4:00 AM
        const MARKET_OPEN = 9 * 60 + 30;       // 9:30 AM
        const MARKET_CLOSE = 16 * 60;          // 4:00 PM
        const POST_MARKET_END = 20 * 60;       // 8:00 PM
        
        if (timeInMinutes >= PRE_MARKET_START && timeInMinutes < MARKET_OPEN) {
          // Last bar is in pre-market
          preMarketPrice = lastClose;
        } else if (timeInMinutes >= MARKET_CLOSE && timeInMinutes < POST_MARKET_END) {
          // Last bar is in post-market
          postMarketPrice = lastClose;
        }
      }
      
      return {
        regularMarketPrice: meta.regularMarketPrice,
        previousClose: meta.previousClose,
        open: dayOpen,
        high: dayHigh,
        low: dayLow,
        volume: meta.regularMarketVolume || quote.volume?.[0] || 0,
        shortName: meta.shortName || meta.symbol,
        preMarketPrice,
        postMarketPrice,
        tradingDay: timestamps.length > 0 
          ? dayjs.unix(timestamps[timestamps.length - 1]).tz(EST).format('YYYY-MM-DD')
          : null,
        fiftyTwoWeekHigh: meta.fiftyTwoWeekHigh,
        fiftyTwoWeekLow: meta.fiftyTwoWeekLow
      };
    };


    const fetchMarketOpenData = async (symbol) => {
      const [yahooData, finnhubData] = await Promise.all([
        fetchYahooQuote(symbol),
        fetchSharesOutstanding(symbol)
      ]);
      if (!yahooData) return null;
      
      return {
        currentPrice: yahooData.regularMarketPrice,
        open: yahooData.open,
        high: yahooData.high,
        low: yahooData.low,
        previousClose: yahooData.previousClose,
        volume: yahooData.volume,
        shortName: yahooData.shortName,
        tradingDay: yahooData.tradingDay,
        extendedHoursPrice: null,
        extendedHoursType: null,
        fiftyTwoWeekHigh: yahooData.fiftyTwoWeekHigh,
        fiftyTwoWeekLow: yahooData.fiftyTwoWeekLow,
        sharesOutstanding: finnhubData?.sharesOutstanding,
        forwardPE: finnhubData?.forwardPE
      };
    };

    const fetchMarketClosedData = async (symbol, marketState) => {
      const [yahooData, finnhubData] = await Promise.all([
        fetchYahooQuote(symbol),
        fetchSharesOutstanding(symbol)
      ]);
      if (!yahooData) return null;
      
      let extendedHoursPrice = null;
      let extendedHoursType = null;
      
      // Get extended hours data from Yahoo (now extracted from last bar)
      if (marketState.state === MarketState.PRE_MARKET && yahooData.preMarketPrice) {
        extendedHoursPrice = yahooData.preMarketPrice;
        extendedHoursType = 'pre';
      } else if (marketState.state === MarketState.POST_MARKET && yahooData.postMarketPrice) {
        extendedHoursPrice = yahooData.postMarketPrice;
        extendedHoursType = 'post';
      }
      
      
      return {
        currentPrice: yahooData.regularMarketPrice,
        open: yahooData.open,
        high: yahooData.high,
        low: yahooData.low,
        previousClose: yahooData.previousClose,
        volume: yahooData.volume,
        shortName: yahooData.shortName,
        tradingDay: yahooData.tradingDay,
        extendedHoursPrice,
        extendedHoursType,
        fiftyTwoWeekHigh: yahooData.fiftyTwoWeekHigh,
        fiftyTwoWeekLow: yahooData.fiftyTwoWeekLow,
        sharesOutstanding: finnhubData?.sharesOutstanding,
        forwardPE: finnhubData?.forwardPE
      };
    };

    const fetchPriceData = async (symbol) => {
      const marketState = getMarketState();
      
      try {
        if (marketState.isRegularHours) {
          return {
            data: await fetchMarketOpenData(symbol),
            marketState
          };
        } else {
          return {
            data: await fetchMarketClosedData(symbol, marketState),
            marketState
          };
        }
      } catch (error) {
        console.error('Price fetch error:', error);
        return { data: null, marketState };
      }
    };

    // STOCK CHART COMPONENT
    function StockChart({ chartData, timeframe, onTimeframeChange, previousClose }) {
      const svgRef = useRef(null);
      const [hoverData, setHoverData] = useState(null);
      
      // Calculate price range and paths
      const { minPrice, maxPrice, priceRange, linePath, areaPath } = useMemo(() => {
        if (!chartData?.length) return { minPrice: 0, maxPrice: 100, priceRange: 100, linePath: '', areaPath: '' };
        
        const min = Math.min(...chartData.map(d => d.low)) * 0.999;
        const max = Math.max(...chartData.map(d => d.high)) * 1.001;
        const range = (max - min) || 1;
        const calcY = (price) => 260 - ((price - min) / range) * 240;
        
        const calcX = (d, i) => {
          if (timeframe === '1D') {
            const estTime = dayjs(d.date).tz(EST);
            const timeInHours = Math.max(9.5, Math.min(16, estTime.hour() + estTime.minute() / 60));
            return 50 + ((timeInHours - 9.5) / 6.5) * 720;
          }
          return 50 + (i / (chartData.length - 1 || 1)) * 720;
        };
        
        const line = chartData.length > 1 ? chartData.map((d, i) => `${i === 0 ? 'M' : 'L'} ${calcX(d, i)} ${calcY(d.close)}`).join(' ') : '';
        const area = line ? `${line} L ${calcX(chartData[chartData.length - 1], chartData.length - 1)} 260 L ${calcX(chartData[0], 0)} 260 Z` : '';
        
        return { minPrice: min, maxPrice: max, priceRange: range, linePath: line, areaPath: area };
      }, [chartData, timeframe]);

      // Determine chart color based on performance
      let isChartPositive = true;
      if (timeframe === '1D') {
        const baseline = previousClose || chartData[0]?.close || 0;
        isChartPositive = (chartData[chartData.length - 1]?.close || 0) >= baseline;
      } else if (chartData.length > 0) {
        isChartPositive = chartData[chartData.length - 1].close >= chartData[0].close;
      }
      const chartColor = isChartPositive ? '#137333' : '#a50e0e';

      // Handle hover interactions
      const handleMouseMove = useCallback((e) => {
        if (!chartData?.length || !svgRef.current) return;
        
        const svgRect = svgRef.current.getBoundingClientRect();
        const scaleX = 800 / svgRect.width;
        let mouseX = Math.max(50, Math.min(770, (e.clientX - svgRect.left) * scaleX));

        let index, dataX;
        
        if (timeframe === '1D') {
          const mouseTimeHours = 9.5 + ((mouseX - 50) / 720) * 6.5;
          let nearestIndex = 0, nearestDiff = Infinity;
          
          chartData.forEach((d, i) => {
            const estTime = dayjs(d.date).tz(EST);
            const timeInHours = estTime.hour() + estTime.minute() / 60;
            const diff = Math.abs(timeInHours - mouseTimeHours);
            if (diff < nearestDiff) { nearestDiff = diff; nearestIndex = i; }
          });
          
          index = nearestIndex;
          const point = chartData[index];
          const estTime = dayjs(point.date).tz(EST);
          const timeInHours = Math.max(9.5, Math.min(16, estTime.hour() + estTime.minute() / 60));
          dataX = 50 + ((timeInHours - 9.5) / 6.5) * 720;
        } else {
          const ratio = (mouseX - 50) / 720;
          index = Math.round(ratio * (chartData.length - 1));
          dataX = 50 + (index / (chartData.length - 1)) * 720;
        }
        
        if (index >= 0 && index < chartData.length) {
          const point = chartData[index];
          const yPos = 260 - ((point.close - minPrice) / priceRange) * 240;
          setHoverData({ dataX, y: yPos, data: point });
        }
      }, [chartData, timeframe, minPrice, priceRange]);

      // Render Y-axis labels
      const renderYAxisLabels = () => {
        const min = Math.floor(minPrice / 20) * 20;
        const max = Math.ceil(maxPrice / 20) * 20;
        const step = Math.ceil((max - min) / 5 / 20) * 20;
        const steps = [];
        for (let p = max; p >= min && steps.length < 6; p -= step) steps.push(p);
        return steps.map(p => (
          <text key={p} x="8" y={20 + ((max - p) / ((max - min) || 1)) * 240 + 4} fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">
            ${p}
          </text>
        ));
      };

      // Render X-axis labels based on timeframe
      const renderXAxisLabels = () => {
        if (!chartData.length) return null;
        
        // Max labels per timeframe
        const maxLabels = {
          '1D': 7,
          '1W': 6,
          '1M': 3,
          '3M': 3,
          '6M': 6,
          'YTD': 12,
          '1Y': 12,
          '5Y': 5
        };
        
        const limit = maxLabels[timeframe] || 6;
        
        // Helper to limit labels - removes from the start to avoid edge crowding
        const spacedLabels = (labels) => {
          if (labels.length <= limit) return labels;
          return labels.slice(labels.length - limit);
        };
        
        let allLabels = [];
        
        if (timeframe === '1D') {
          allLabels = ['10:00','11:00','12:00','13:00','14:00','15:00','16:00'].map((label, idx) => ({
            label,
            x: 50 + ((0.5 + idx) / 6.5) * 720
          }));
        } else if (timeframe === '1W') {
          const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          const seen = new Set();
          chartData.forEach((d, i) => {
            const date = dayjs(d.date).format('YYYY-MM-DD');
            if (seen.has(date)) return;
            seen.add(date);
            allLabels.push({
              label: days[dayjs(d.date).day()],
              x: 50 + (i / (chartData.length - 1 || 1)) * 720
            });
          });
        } else if (timeframe === '5Y') {
          const seen = new Set();
          chartData.forEach((d, i) => {
            const year = dayjs(d.date).year();
            if (seen.has(year)) return;
            seen.add(year);
            allLabels.push({
              label: String(year).slice(-2),
              x: 50 + (i / (chartData.length - 1 || 1)) * 720
            });
          });
        } else {
          // Default: show months (for 1M, 3M, 6M, YTD, 1Y)
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const seen = new Set();
          chartData.forEach((d, i) => {
            const dt = dayjs(d.date);
            const key = `${dt.year()}-${dt.month()}`;
            if (seen.has(key)) return;
            seen.add(key);
            allLabels.push({
              label: months[dt.month()],
              x: 50 + (i / (chartData.length - 1 || 1)) * 720
            });
          });
        }
        
        const finalLabels = spacedLabels(allLabels);
        
        return (
          <g>
            {finalLabels.map((item, idx) => (
              <text key={idx} x={item.x} y="290" textAnchor="middle" fontSize="11" fill="#80868b" fontFamily="IBM Plex Mono">
                {item.label}
              </text>
            ))}
          </g>
        );
      };

      return (
        <div className="box chart-box">
          <div className="timeframe-controls">
            {['1D', '1W', '1M', '3M', '6M', 'YTD', '1Y', '5Y'].map((tf, idx, arr) => (
              <React.Fragment key={tf}>
                <button className={`timeframe-btn ${timeframe === tf ? 'active' : ''}`} onClick={() => onTimeframeChange(tf)}>
                  {tf}
                </button>
                {idx < arr.length - 1 && <span className="timeframe-pipe">|</span>}
              </React.Fragment>
            ))}
          </div>
          
          <svg 
            ref={svgRef} 
            viewBox="0 0 800 300" 
            preserveAspectRatio="none" 
            style={{ width: '100%', height: '100%', cursor: 'crosshair' }} 
            onMouseMove={handleMouseMove} 
            onMouseLeave={() => setHoverData(null)}
          >
            <defs>
              <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={isChartPositive ? 'rgba(19,115,51,0.2)' : 'rgba(165,14,14,0.2)'} />
                <stop offset="100%" stopColor={isChartPositive ? 'rgba(19,115,51,0)' : 'rgba(165,14,14,0)'} />
              </linearGradient>
            </defs>
            
            {renderYAxisLabels()}
            
            {areaPath && <path d={areaPath} fill="url(#grad)" />}
            {linePath && <path d={linePath} fill="none" stroke={chartColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
            
            {(() => {
              const labels = renderXAxisLabels();
              return labels;
            })()}
            
            {hoverData && (
              <g pointerEvents="none">
                <line x1={hoverData.dataX} y1="20" x2={hoverData.dataX} y2="260" stroke="#666" strokeWidth="1" strokeDasharray="4" />
                <line x1="50" y1={hoverData.y} x2="770" y2={hoverData.y} stroke="#666" strokeWidth="1" strokeDasharray="4" />
                <circle cx={hoverData.dataX} cy={hoverData.y} r="3.5" fill={chartColor} stroke="#fff" strokeWidth="2" />
              </g>
            )}
          </svg>
          
          {hoverData && (
            <div style={{ 
              position: 'absolute', 
              left: `${(hoverData.dataX / 800) * 100}%`, 
              top: `${(hoverData.y / 300) * 100}%`, 
              transform: hoverData.dataX < 400 ? 'translate(10px, -50%)' : 'translate(-130px, -50%)', 
              pointerEvents: 'none', 
              zIndex: 10 
            }}>
              <div style={{ background: 'rgba(26, 26, 26, 0.9)', padding: '8px 12px', borderRadius: '4px', minWidth: '80px', textAlign: 'center' }}>
                <div style={{ color: '#fff', fontSize: '13px', fontWeight: 600, fontFamily: 'IBM Plex Mono', marginBottom: '4px' }}>
                  ${hoverData.data.close.toFixed(2)}
                </div>
                <div style={{ color: '#ccc', fontSize: '10px', fontFamily: 'IBM Plex Mono' }}>
                  {timeframe === '1D' 
                    ? dayjs(hoverData.data.date).tz(EST).format('HH:mm')
                    : dayjs(hoverData.data.date).tz(EST).format('MMM D')}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // MAIN COMPONENT
    function StockTracker() {
      const [ticker, setTicker] = useState('TSLA');
      const [inputTicker, setInputTicker] = useState('');
      const [data, setData] = useState([]);
      const [chartData, setChartData] = useState([]);
      const [timeframe, setTimeframe] = useState('6M');
      const [quote, setQuote] = useState(null);
      const [loading, setLoading] = useState(true);
      const [priceUpdating, setPriceUpdating] = useState(false);
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [sharesCount, setSharesCount] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [chartCache, setChartCache] = useState({});
      const [currentMarketState, setCurrentMarketState] = useState(getMarketState());
      
      const lastPriceRef = useRef(null);
      const wsRef = useRef(null);

      // MARKET STATE MONITORING      
      useEffect(() => {
        const interval = setInterval(() => {
          const newState = getMarketState();
          setCurrentMarketState(prev => {
            if (prev.state !== newState.state) {
              console.log(`Market state changed: ${prev.state} → ${newState.state}`);
              return newState;
            }
            return prev;
          });
        }, 60000);
        
        return () => clearInterval(interval);
      }, []);

      // CACHE HELPERS
      const getCachedData = (symbol) => {
        const cached = localStorage.getItem(`stock_${symbol}`);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < CACHE_DURATION) return data;
        }
        return null;
      };

      const setCachedData = (symbol, data) => {
        localStorage.setItem(`stock_${symbol}`, JSON.stringify({ data, timestamp: Date.now() }));
      };

      // MAIN DATA FETCHER
      const fetchStockData = async (symbol) => {
        setLoading(true);
        const marketState = getMarketState();
        setCurrentMarketState(marketState);
        
        try {
          const { data: priceData } = await fetchPriceData(symbol);
          
          if (priceData) {
            setCompanyName(priceData.shortName || symbol);
          }

          let historicalData = getCachedData(symbol);
          if (!historicalData) {
            const barsRes = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=6mo&interval=1d`);
            const barsData = await barsRes.json();
            if (barsData?.chart?.result?.[0]) {
              const result = barsData.chart.result[0];
              const timestamps = result.timestamp;
              const quote = result.indicators.quote[0];
              if (timestamps && quote) {
                historicalData = timestamps.map((t, i) => ({
                  date: dayjs.unix(t).format('YYYY-MM-DD'),
                  open: quote.open[i],
                  high: quote.high[i],
                  low: quote.low[i],
                  close: quote.close[i],
                  volume: quote.volume[i] || 0
                })).filter(day => day.close !== null)
                   .sort((a, b) => dayjs(a.date).unix() - dayjs(b.date).unix());
                setCachedData(symbol, historicalData);
              }
            }
          }

          if (historicalData?.length >= 2 && priceData) {
            const previousClose = priceData.previousClose || historicalData[historicalData.length - 2].close;
            const change = priceData.currentPrice - previousClose;
            
            setQuote({
              c: priceData.currentPrice,
              o: priceData.open,
              h: priceData.high,
              l: priceData.low,
              pc: previousClose,
              d: change,
              dp: (change / previousClose) * 100,
              volume: priceData.volume,
              tradingDay: priceData.tradingDay,
              extendedHoursPrice: priceData.extendedHoursPrice,
              extendedHoursType: priceData.extendedHoursType,
              fiftyTwoWeekHigh: priceData.fiftyTwoWeekHigh,
              fiftyTwoWeekLow: priceData.fiftyTwoWeekLow,
              sharesOutstanding: priceData.sharesOutstanding,
              forwardPE: priceData.forwardPE
            });
            
            // Log market status and price
            console.log(`Market: ${marketState.state.toUpperCase()} | ${symbol}: $${priceData.currentPrice.toFixed(2)}${priceData.extendedHoursPrice ? ` | Extended: $${priceData.extendedHoursPrice.toFixed(2)}` : ''}`);
          }

          if (historicalData?.length > 0) setData(historicalData);
        } catch (error) { 
          console.error('Error:', error); 
        }
        setLoading(false);
      };

      // CHART DATA FETCHER
      const fetchChartData = useCallback(async (symbol, tf) => {
        const marketState = getMarketState();
        
        try {
          if (['1M', '3M', '6M'].includes(tf) && data.length > 0) {
            const months = { '1M': 1, '3M': 3, '6M': 6 }[tf];
            const cutoffDate = dayjs().subtract(months, 'month');
            setChartData(data.filter(d => dayjs(d.date).isAfter(cutoffDate)));
            return;
          }
          
          const cacheKey = `${symbol}-${tf}`;
          const skipCache = tf === '1D' && marketState.isRegularHours;
          if (!skipCache && chartCache[cacheKey]) {
            setChartData(chartCache[cacheKey]);
            return;
          }
          
          const params = {
            '1D': ['1d', '5m'], '1W': ['5d', '15m'], '1M': ['1mo', '1d'],
            '3M': ['3mo', '1d'], '6M': ['6mo', '1d'], 'YTD': ['ytd', '1d'],
            '1Y': ['1y', '1d'], '5Y': ['5y', '1d']
          }[tf] || ['6mo', '1d'];
          
          const barsRes = await fetch(`${WORKER_URL}/yahoo/${symbol}?range=${params[0]}&interval=${params[1]}`);
          const barsData = await barsRes.json();
          
          if (barsData?.chart?.result?.[0]) {
            const result = barsData.chart.result[0];
            const timestamps = result.timestamp;
            const quote = result.indicators.quote[0];
            if (timestamps && quote) {
              const chartBars = timestamps.map((t, i) => ({
                date: dayjs.unix(t).toISOString(),
                open: quote.open[i],
                high: quote.high[i],
                low: quote.low[i],
                close: quote.close[i],
                volume: quote.volume[i] || 0
              })).filter(b => b.close !== null);
              
              setChartData(chartBars);
              if (!skipCache) {
                setChartCache(prev => ({ ...prev, [cacheKey]: chartBars }));
              }
            }
          }
        } catch (error) { 
          console.error('Error fetching chart data:', error); 
        }
      }, [data, chartCache]);

      // EFFECTS: Initial load and ticker changes
      useEffect(() => { 
        setChartCache({});
        lastPriceRef.current = null;
        fetchStockData(ticker); 
      }, [ticker]);
      
      useEffect(() => { 
        if (ticker) fetchChartData(ticker, timeframe); 
      }, [ticker, timeframe, fetchChartData]);

      // CONSOLIDATED WEBSOCKET - Handles connection, reconnection, ticker changes, and cleanup
      useEffect(() => {
        let ws = null;
        let reconnectTimeout = null;
        let reconnectAttempts = 0;
        let isConnecting = false;
        let currentSubscribedSymbol = null;
        let isMounted = true;
        
        const MAX_RECONNECT_ATTEMPTS = 15;
        const INITIAL_RECONNECT_DELAY = 500;
        const MAX_RECONNECT_DELAY = 30000;
        
        const getReconnectDelay = () => {
          // Fast retries initially (500ms, 1s, 2s), then slow down
          const delay = Math.min(INITIAL_RECONNECT_DELAY * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
          return delay;
        };
        
        const connectWebSocket = async () => {
          if (!isMounted) return;
          
          const marketState = getMarketState();
          
          if (!marketState.isRegularHours) {
            console.log(`WebSocket skipped: Market is ${marketState.state}`);
            return;
          }
          
          if (isConnecting) {
            console.log('WebSocket connection already in progress');
            return;
          }
          
          // Close existing connection if any
          if (ws) {
            ws.onclose = null;
            ws.onerror = null;
            ws.close();
            ws = null;
          }
          if (wsRef.current) {
            wsRef.current.onclose = null;
            wsRef.current.onerror = null;
            wsRef.current.close();
            wsRef.current = null;
          }
          
          isConnecting = true;
          console.log(`WebSocket connecting... (attempt ${reconnectAttempts + 1})`);
          
          try {
            // Fetch WebSocket URL from worker (keeps API key server-side)
            const res = await fetch(`${WORKER_URL}/finnhub/ws-url`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const { url: wsUrl } = await res.json();
            
            if (!isMounted) {
              isConnecting = false;
              return;
            }
            
            ws = new WebSocket(wsUrl);
            
            // Set a connection timeout
            const connectionTimeout = setTimeout(() => {
              if (ws && ws.readyState !== WebSocket.OPEN) {
                console.log('WebSocket connection timeout');
                ws.close();
              }
            }, 10000);
            
            ws.onopen = () => {
              clearTimeout(connectionTimeout);
              if (!isMounted) {
                ws.close();
                return;
              }
              
              console.log('WebSocket connected');
              isConnecting = false;
              reconnectAttempts = 0;
              wsRef.current = ws;
              
              if (ticker) {
                ws.send(JSON.stringify({ type: 'subscribe', symbol: ticker }));
                currentSubscribedSymbol = ticker;
                console.log(`Subscribed to ${ticker}`);
              }
            };
            
            ws.onmessage = (event) => {
              try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'trade' && msg.data?.length > 0) {
                  const newPrice = msg.data[msg.data.length - 1].p;
                  if (lastPriceRef.current === newPrice) return;
                  lastPriceRef.current = newPrice;
                  
                  setQuote(prev => {
                    if (!prev) return prev;
                    const change = newPrice - prev.pc;
                    return {
                      ...prev,
                      c: newPrice,
                      d: change,
                      dp: (change / prev.pc) * 100,
                      h: Math.max(prev.h || newPrice, newPrice),
                      l: Math.min(prev.l || newPrice, newPrice)
                    };
                  });
                  setPriceUpdating(true);
                  setTimeout(() => setPriceUpdating(false), 150);
                }
              } catch (e) {}
            };
            
            ws.onerror = (error) => {
              clearTimeout(connectionTimeout);
              console.error('WebSocket error:', error);
              isConnecting = false;
            };
            
            ws.onclose = (event) => {
              clearTimeout(connectionTimeout);
              console.log(`WebSocket closed (code: ${event.code})`);
              isConnecting = false;
              wsRef.current = null;
              currentSubscribedSymbol = null;
              
              if (isMounted) {
                const marketState = getMarketState();
                if (marketState.isRegularHours) {
                  scheduleReconnect();
                }
              }
            };
            
          } catch (e) {
            console.error('WebSocket setup failed:', e);
            isConnecting = false;
            if (isMounted) {
              scheduleReconnect();
            }
          }
        };
        
        const scheduleReconnect = () => {
          if (reconnectTimeout) {
            clearTimeout(reconnectTimeout);
            reconnectTimeout = null;
          }
          
          if (!isMounted) return;
          
          const marketState = getMarketState();
          if (!marketState.isRegularHours) return;
          
          if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
            console.log('Max reconnection attempts reached, will retry in 60s');
            reconnectAttempts = 0;
            reconnectTimeout = setTimeout(connectWebSocket, 60000);
            return;
          }
          
          const delay = getReconnectDelay();
          reconnectAttempts++;
          
          console.log(`WebSocket reconnecting in ${delay}ms (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
          reconnectTimeout = setTimeout(connectWebSocket, delay);
        };
        
        // Initial connection - start immediately if market is open
        const marketState = getMarketState();
        if (marketState.isRegularHours) {
          connectWebSocket();
        }
        
        // Monitor for market open/close transitions and connection health
        const marketCheckInterval = setInterval(() => {
          if (!isMounted) return;
          
          const marketState = getMarketState();
          const hasConnection = wsRef.current?.readyState === WebSocket.OPEN;
          
          if (marketState.isRegularHours && !hasConnection && !isConnecting) {
            console.log('Market is open but no connection - reconnecting');
            reconnectAttempts = 0;
            connectWebSocket();
          } else if (!marketState.isRegularHours && hasConnection) {
            console.log('Market closed - disconnecting WebSocket');
            if (wsRef.current) {
              wsRef.current.onclose = null;
              wsRef.current.close();
            }
            wsRef.current = null;
            currentSubscribedSymbol = null;
          }
        }, 15000); // Check every 15s instead of 60s
        
        return () => {
          isMounted = false;
          clearInterval(marketCheckInterval);
          if (reconnectTimeout) clearTimeout(reconnectTimeout);
          if (ws) {
            ws.onclose = null;
            ws.onerror = null;
            if (currentSubscribedSymbol && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'unsubscribe', symbol: currentSubscribedSymbol }));
            }
            ws.close();
          }
          if (wsRef.current) {
            wsRef.current.onclose = null;
            wsRef.current.onerror = null;
            wsRef.current.close();
          }
          wsRef.current = null;
        };
      }, [ticker]);

      // MARKET OPEN ONLY - Periodic 1D chart refresh      
      useEffect(() => {
        if (timeframe !== '1D') return;
        
        const marketState = getMarketState();
        if (!marketState.isRegularHours) return;
        
        const interval = setInterval(() => {
          const currentState = getMarketState();
          if (currentState.isRegularHours) {
            fetchChartData(ticker, '1D');
          }
        }, 60000);
        
        return () => clearInterval(interval);
      }, [ticker, timeframe, fetchChartData]);

      // EXTENDED HOURS ONLY - Poll for price updates every 30 seconds
      useEffect(() => {
        const marketState = getMarketState();
        
        // Only poll during pre-market or post-market
        if (!marketState.isExtendedHours) return;
        
        const pollExtendedHours = async () => {
          const currentState = getMarketState();
          
          // Stop polling if market opened or fully closed
          if (!currentState.isExtendedHours) {
            console.log('Extended hours ended, stopping poll');
            return;
          }
          
          try {
            const { data: priceData } = await fetchPriceData(ticker);
            
            if (priceData && priceData.extendedHoursPrice) {
              setQuote(prev => {
                if (!prev) return prev;
                return {
                  ...prev,
                  extendedHoursPrice: priceData.extendedHoursPrice,
                  extendedHoursType: priceData.extendedHoursType
                };
              });
              
              console.log(`Market: ${currentState.state.toUpperCase()} | ${ticker}: $${priceData.currentPrice.toFixed(2)} | Extended: $${priceData.extendedHoursPrice.toFixed(2)}`);
            }
          } catch (error) {
            console.error('Extended hours poll error:', error);
          }
        };
        
        const interval = setInterval(pollExtendedHours, 5000);
        
        return () => {
          console.log('Extended hours polling stopped');
          clearInterval(interval);
        };
      }, [ticker]);

      // SPREADSHEET DATA PROCESSING
      const processSpreadsheetData = useMemo(() => {
        const dataWithToday = [...data];
        const todayEST = getTodayEST();
        const apiTradingDay = quote?.tradingDay;
        const shouldProcessTodayRow = apiTradingDay === todayEST || currentMarketState.isRegularHours;
        
        // Normalize date comparison - handles both ISO strings and YYYY-MM-DD
        const toDateStr = (d) => d ? dayjs(d).format('YYYY-MM-DD') : null;
        const historicalDataHasToday = toDateStr(data[data.length - 1]?.date) === todayEST;
        
        if (shouldProcessTodayRow && quote?.c) {
          if (historicalDataHasToday) {
            const todayIndex = dataWithToday.findIndex(d => toDateStr(d.date) === todayEST);
            if (todayIndex !== -1) {
              dataWithToday[todayIndex] = {
                ...dataWithToday[todayIndex],
                open: quote.o || dataWithToday[todayIndex].open,
                high: quote.h || dataWithToday[todayIndex].high,
                low: quote.l || dataWithToday[todayIndex].low,
                close: quote.c,
                volume: quote.volume || dataWithToday[todayIndex].volume,
                isToday: currentMarketState.isRegularHours
              };
            }
          } else {
            dataWithToday.push({
              date: todayEST,
              open: quote.o || quote.c,
              high: quote.h || quote.c,
              low: quote.l || quote.c,
              close: quote.c,
              volume: quote.volume || 0,
              isToday: currentMarketState.isRegularHours
            });
          }
        }
        
        const cleanedData = dataWithToday.filter(d => !(d.isToday && toDateStr(d.date) !== todayEST));
        
        const dataWithChange = cleanedData.map((row, index) => ({
          ...row,
          chg: index === 0 ? null : row.close - cleanedData[index - 1].close
        }));
        
        return dataWithChange;
      }, [data, quote, currentMarketState]);

      const sortedData = useMemo(() => {
        return [...processSpreadsheetData].sort((a, b) => {
          if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
          if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }, [processSpreadsheetData, sortConfig]);

      // DERIVED VALUES
      const currentPrice = quote?.c || data[data.length - 1]?.close || 0;
      const lastTwo = processSpreadsheetData.slice(-2);
      const todayChange = lastTwo.length === 2 ? lastTwo[1].close - lastTwo[0].close : 0;
      const todayChangePercent = lastTwo.length === 2 ? (todayChange / lastTwo[0].close) * 100 : 0;
      const dayHigh = quote?.h || data[data.length - 1]?.high || 0;
      const dayLow = quote?.l || data[data.length - 1]?.low || 0;
      const avgVolume = data.length > 0 ? data.reduce((sum, d) => sum + d.volume, 0) / data.length : 0;
      const week52High = quote?.fiftyTwoWeekHigh || (data.length > 0 ? Math.max(...data.map(d => d.high)) : 0);
      const week52Low = quote?.fiftyTwoWeekLow || (data.length > 0 ? Math.min(...data.map(d => d.low)) : 0);
      const marketCap = quote?.sharesOutstanding ? (quote.sharesOutstanding * currentPrice) / 1e6 : 0;
      const forwardPE = quote?.forwardPE || 0;

      // CHART CALCULATIONS
      // HANDLERS
      const handleTickerSubmit = (e) => {
        e.preventDefault();
        if (inputTicker.trim()) {
          setTicker(inputTicker.toUpperCase());
          setInputTicker('');
          setSharesCount('');
        }
      };

      const handleSort = (key) => {
        setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
      };

      // RENDER
      return (
        <div style={{ minHeight: '100vh', background: '#f4f1e8', fontFamily: '"IBM Plex Mono", monospace', color: '#1a1a1a', padding: '22px' }}> 
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

            .ticker-display { font-size: 44px; font-weight: 600; letter-spacing: -1px; }
            .ticker-form { display: flex; gap: 8px; }
            .ticker-input { background: transparent; border: 2px solid #1a1a1a; padding: 9px 12px; font-family: inherit; font-size: 14px; text-transform: uppercase; width: 90px; letter-spacing: 2px; margin-bottom: 8px;}
            .ticker-input:focus { outline: none; background: rgba(0,0,0,0.05); }
            .top-row { display: flex; gap: 20px; margin-bottom: 0; margin-top: 20px; }
            .top-row .price-section { flex: 0 0 auto; width: 340px; }
            .top-row .chart-wrapper { flex: 1; display: flex; flex-direction: column; }

            .price-main { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
            .price-current { font-size: 36px; font-weight: 600; letter-spacing: -1px; transition: filter 0.3s ease; }
            .price-current.flash { filter: brightness(1.4); }
            .price-change { font-size: 16px; font-weight: 500; transition: filter 0.3s ease; margin-top: 8px; }
            .price-change.flash { filter: brightness(1.3); }
            .status-dot { width: 8px; height: 8px; border-radius: 50%; }
            .status-dot.open { background: #2d5a3d; box-shadow: 0 0 8px rgba(45, 90, 61, 0.6); }
            .status-dot.closed { background: #8b3a3a; box-shadow: 0 0 8px rgba(139, 58, 58, 0.6); }

            @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

              .stat-row { padding: 10px 0; }
            }
          `}</style>

          {loading && <div className="loading"><div className="loading-text">Loading {ticker}...</div></div>}

          <div className="container">
            <header className="header">
              <div className="ticker-display">{companyName || ticker}</div>
              <form className="ticker-form" onSubmit={handleTickerSubmit}>
                <input type="text" className="ticker-input" value={inputTicker} onChange={(e) => setInputTicker(e.target.value)} placeholder="TICKER" maxLength={5} />
              </form>
            </header>

            <div className="top-row">
              <div className="price-section box">
                <div className="price-main">
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', width: '100%'}}>
                    <div style={{display: 'flex', flexDirection: 'column'}}>
                      <span className={`price-current ${priceUpdating ? 'flash' : ''}`}>${currentPrice.toFixed(2)}</span>
                      <span className={`price-change ${todayChange >= 0 ? 'positive' : 'negative'} ${priceUpdating ? 'flash' : ''}`}>
                        {todayChange >= 0 ? '+' : ''}{todayChange.toFixed(2)} ({todayChange >= 0 ? '+' : ''}{todayChangePercent.toFixed(2)}%)
                      </span>
                    </div>
                    <div className={`status-dot ${currentMarketState.isRegularHours ? 'open' : 'closed'}`}></div>
                  </div>
                </div>
                
                {!currentMarketState.isRegularHours && quote?.extendedHoursPrice && (() => {
                  const marketChange = quote.extendedHoursPrice - currentPrice;
                  const marketChangePercent = (marketChange / currentPrice) * 100;
                  const isPositive = marketChange >= 0;
                  
                  return (
                    <div className="extended-hours-bar">
                      <span style={{ fontSize: '12px', fontWeight: 600 }}>{quote.extendedHoursType === 'pre' ? 'PRE' : 'POST'}</span>
                      <span style={{ fontSize: '18px', fontWeight: 600, marginRight: '16px' }}>${quote.extendedHoursPrice.toFixed(2)}</span>
                      <span className={isPositive ? 'positive' : 'negative'} style={{ fontSize: '13px', fontWeight: 600 }}>
                        {isPositive ? '+' : ''}${marketChange.toFixed(2)} ({isPositive ? '+' : ''}{marketChangePercent.toFixed(2)}%)
                      </span>
                    </div>
                  );
                })()}
                
                <hr style={{margin: '16px 0', border: 'none', borderTop: '1px solid #e8e5dc'}} />
                <div className="stats-grid">
                  <div className="stat-row"><span className="stat-label">Day Range</span><span className="stat-value">{dayLow.toFixed(2)} - {dayHigh.toFixed(2)}</span></div>
                  <div className="stat-row"><span className="stat-label">52 Week Range</span><span className="stat-value">{week52Low.toFixed(2)} - {week52High.toFixed(2)}</span></div>

                  <div className="stat-row"><span className="stat-label">Forward P/E</span><span className="stat-value">{forwardPE > 0 ? forwardPE.toFixed(2) : 'N/A'}</span></div>
                </div>

                  chartData={chartData}

            <div className="box spreadsheet" style={{marginTop: '20px'}}>
              <div className="spreadsheet-header">
                <div onClick={() => handleSort('date')}>date {sortConfig.key === 'date' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('open')}>open {sortConfig.key === 'open' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('high')}>high {sortConfig.key === 'high' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('low')}>low {sortConfig.key === 'low' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('close')}>close {sortConfig.key === 'close' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('volume')}>vol {sortConfig.key === 'volume' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div onClick={() => handleSort('chg')}>chg {sortConfig.key === 'chg' && <span className="sort-indicator">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>}</div>
                <div className="header-input-cell"><input type="text" className="header-input" value={sharesCount ? parseInt(sharesCount).toLocaleString() : ''} onChange={(e) => { const v = e.target.value.replace(/,/g, ''); if (v === '' || /^\d+$/.test(v)) setSharesCount(v); }} placeholder="#" /></div>
              </div>
              <div className="spreadsheet-body">
                {sortedData.map((row) => {
                  const shares = parseInt(sharesCount) || 0;
                  const value = shares > 0 ? Math.round(shares * row.close) : null;
                  const isLivePrice = row.isToday && currentMarketState.isRegularHours;
                  
                  return (
                    <div key={row.date} className="spreadsheet-row">
                      <div className="spreadsheet-cell">{dayjs(row.date).format('YYYY-MM-DD')}</div>
                      <div className="spreadsheet-cell">${row.open.toFixed(2)}</div>
                      <div className="spreadsheet-cell">${row.high.toFixed(2)}</div>
                      <div className="spreadsheet-cell">${row.low.toFixed(2)}</div>
                      <div className={`spreadsheet-cell ${isLivePrice ? 'live-price' : ''}`}>${row.close.toFixed(2)}</div>
                      <div className="spreadsheet-cell">{row.volume > 500000 ? (row.volume / 1000000).toFixed(0) + 'M' : '—'}</div>
                      <div className={`spreadsheet-cell ${row.chg !== null ? (row.chg >= 0 ? 'positive' : 'negative') : ''}`}>{row.chg !== null ? `${row.chg >= 0 ? '+' : ''}${row.chg.toFixed(2)}` : '—'}</div>
                      <div className="spreadsheet-cell value-cell">{value !== null && <>${value.toLocaleString()}{row.chg !== null && <span className={row.chg >= 0 ? 'positive' : 'negative'}> | {row.chg >= 0 ? '+' : ''}${Math.round(row.chg * shares).toLocaleString()}</span>}</>}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="timestamp">
              Last updated: {dayjs().format('MMM D, YY HH:mm')} 
              <span style={{ marginLeft: '12px', opacity: 0.7 }}>Market: {currentMarketState.state}</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StockTracker />);
  </script>
</body>
</html>
