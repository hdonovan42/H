<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSnipe — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #111118;
      --card: #181820;
      --border: #2a2a38;
      --text: #d0d0d8;
      --dim: #787890;
      --bright: #f0f0f8;
      --accent: #FF6B00;
      --success: #45d48a;
      --danger: #e74c3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
      padding: 32px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .subtitle { color: var(--dim); font-size: 11px; margin-bottom: 32px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .label {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    h2 {
      font-size: 13px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
    }
    th {
      text-align: left;
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    tr:hover td { background: var(--card); }
    .tier {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .tier.free { background: var(--border); color: var(--dim); }
    .tier.pro { background: #cc5500; color: #fff; }
    .refresh-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      float: right;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--dim); font-size: 12px; padding: 20px; text-align: center; }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <h1>AUTOSNIPE ADMIN</h1>
  <p class="subtitle">dash.autosnipe.co.uk — protected</p>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="value" id="s-users">-</div><div class="label">Users</div></div>
    <div class="stat-card"><div class="value" id="s-searches">-</div><div class="label">Active Searches</div></div>
    <div class="stat-card"><div class="value" id="s-listings">-</div><div class="label">Listings Found</div></div>
  </div>

  <h2>Users <button class="refresh-btn" onclick="load()">Refresh</button></h2>
  <table>
    <thead><tr><th>#</th><th>Email</th><th>Phone</th><th>Tier</th><th>Signed Up</th></tr></thead>
    <tbody id="users-body"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
  </table>

  <h2>Recent Poll Log</h2>
  <table>
    <thead><tr><th>Search</th><th>Status</th><th>Found</th><th>New</th><th>Iterations</th><th>Time</th></tr></thead>
    <tbody id="polls-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
  </table>

  <script>
    // API calls go to the main domain
    const API = 'https://autosnipe.co.uk'

    async function load() {
      try {
        const [stats, users, polls] = await Promise.all([
          fetch(API + '/api/admin/stats').then(r => r.json()),
          fetch(API + '/api/admin/users').then(r => r.json()),
          fetch(API + '/api/admin/poll-log-all').then(r => r.json())
        ])

        document.getElementById('s-users').textContent = stats.users
        document.getElementById('s-searches').textContent = stats.activeSearches
        document.getElementById('s-listings').textContent = stats.totalListings

        const ub = document.getElementById('users-body')
        if (!users.length) {
          ub.innerHTML = '<tr><td colspan="5" class="empty">No users yet</td></tr>'
        } else {
          ub.innerHTML = users.map(u => `<tr>
            <td>${u.id}</td>
            <td>${u.email}</td>
            <td>${u.phone || '<span style="color:var(--dim)">—</span>'}</td>
            <td><span class="tier ${u.tier}">${u.tier}</span></td>
            <td>${u.created_at}</td>
          </tr>`).join('')
        }

        const pb = document.getElementById('polls-body')
        if (!polls.length) {
          pb.innerHTML = '<tr><td colspan="6" class="empty">No polls yet</td></tr>'
        } else {
          pb.innerHTML = polls.map(p => `<tr>
            <td>${p.search_name || '#' + p.search_id}</td>
            <td style="color:${p.status === 'success' ? 'var(--success)' : p.status === 'error' ? 'var(--danger)' : 'var(--dim)'}">${p.status}</td>
            <td>${p.listings_found}</td>
            <td>${p.new_listings}</td>
            <td>${p.iterations}</td>
            <td>${p.started_at}</td>
          </tr>`).join('')
        }
      } catch (err) {
        console.error(err)
      }
    }

    load()
    setInterval(load, 30000)
  </script>
</body>
</html>
