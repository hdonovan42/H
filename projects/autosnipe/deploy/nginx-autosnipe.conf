server {
    listen 80;
    server_name autosnipe.co.uk www.autosnipe.co.uk;
    return 301 https://autosnipe.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name autosnipe.co.uk www.autosnipe.co.uk;

    ssl_certificate /etc/letsencrypt/live/autosnipe.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autosnipe.co.uk/privkey.pem;

    root /home/hq/autosnipe/dist;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Stripe webhook — no extra auth needed
    location /api/stripe/webhook {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
