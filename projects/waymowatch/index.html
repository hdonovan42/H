<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaymoNet — London base map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#map{height:100%;width:100%;background:#e8e6e1}
  body{font-family:Consolas,'Courier New',monospace;overflow:hidden}
  .ui{position:absolute;top:12px;left:12px;z-index:10;display:flex;gap:6px}
  .ui button{background:rgba(255,255,255,.92);color:#3a4046;border:1px solid #c9c4ba;
    border-radius:6px;padding:8px 13px;font-family:inherit;font-size:11px;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ui button.on{color:#fff;background:#2f6fed;border-color:#2f6fed;font-weight:bold}
  #err{display:none;position:absolute;top:60px;left:12px;right:12px;z-index:20;
    background:#fde8e8;color:#8a1f2d;border:1px solid #e3a5a5;border-radius:6px;
    padding:10px 14px;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="map"></div>
<div class="ui">
  <button id="b3">3D</button>
  <button id="b2" class="on">2D</button>
</div>
<div id="err"></div>
<script>
/* ============================================================
   WaymoNet base map
   Stack: MapLibre GL JS (BSD) + OpenFreeMap "Liberty" vector
   style (free, no API key, no rate limits) + OSM building
   heights rendered as 3D extrusions.
   ============================================================ */

const errBox=document.getElementById('err');
const showErr=m=>{errBox.style.display='block';errBox.textContent+=m+'\n'};
window.addEventListener('error',e=>showErr('JS error: '+e.message));

if(typeof maplibregl==='undefined'){
  showErr('MapLibre failed to load from unpkg. Check internet connection / firewall.');
}else{

const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[-0.0855,51.5095],      // City of London
  zoom:14.6,
  pitch:0,
  bearing:0,
  antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
map.on('error',e=>{if(e&&e.error)showErr('Map error: '+e.error.message)});

let mode3d=false;

/* runs on initial load AND any future setStyle(), so the 3D
   building layer always survives style changes */
map.on('style.load',()=>{
  const style=map.getStyle();
  const srcId=Object.keys(style.sources).find(k=>style.sources[k].type==='vector');
  if(!srcId){showErr('No vector source found in style.');return}

  // hide flat footprints; extrusions replace them
  style.layers.forEach(l=>{
    if(l['source-layer']==='building')
      map.setLayoutProperty(l.id,'visibility','none');
  });

  // insert below the first symbol layer so labels render on top
  const firstLabel=style.layers.find(l=>l.type==='symbol');
  map.addLayer({
    id:'buildings-3d',
    type:'fill-extrusion',
    source:srcId,
    'source-layer':'building',
    minzoom:13,
    layout:{visibility:mode3d?'visible':'none'},
    paint:{
      'fill-extrusion-height':['coalesce',['get','render_height'],8],
      'fill-extrusion-base'  :['coalesce',['get','render_min_height'],0],
      // warm stone ramp, low -> tall, matched to Liberty's palette
      'fill-extrusion-color' :['interpolate',['linear'],
        ['coalesce',['get','render_height'],8],
        0,'#ded6c8', 40,'#cfc4b2', 120,'#b5a994', 310,'#998a72'],
      'fill-extrusion-opacity':0.92
    }
  }, firstLabel?firstLabel.id:undefined);
});

/* ---- 2D / 3D toggle ---- */
const b3=document.getElementById('b3'),b2=document.getElementById('b2');
b3.onclick=()=>{mode3d=true;b3.classList.add('on');b2.classList.remove('on');
  if(map.getLayer('buildings-3d'))map.setLayoutProperty('buildings-3d','visibility','visible');
  map.easeTo({pitch:58,bearing:-28,duration:1000})};
b2.onclick=()=>{mode3d=false;b2.classList.add('on');b3.classList.remove('on');
  if(map.getLayer('buildings-3d'))map.setLayoutProperty('buildings-3d','visibility','none');
  map.easeTo({pitch:0,bearing:0,duration:1000})};

/* ============================================================
   NEXT STEP (when ready): live vehicle layer.
   1) map.addSource('vehicles',{type:'geojson',data:emptyFC})
   2) add a circle or symbol layer on that source
   3) on each WebSocket tick:
        map.getSource('vehicles').setData(latestFC)
   MapLibre re-renders at 60fps; thousands of points are fine.
   ============================================================ */
}
</script>
</body>
</html>
