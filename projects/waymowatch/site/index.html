<style>
  /* Hammersmith One (latin) — self-hosted, SIL OFL 1.1 (assets/OFL-HammersmithOne.txt) */
  @font-face {
    font-family: "Hammersmith One";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/hammersmith-one-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --paper: #FBFAF7;
    --ink: #16161F;
    --blue: #000F9F;     /* corporate line blue */
    --red: #E32017;
    --grey: #6E6E73;
    --hairline: #D9D7D0;
    --display: "Hammersmith One", "Gill Sans", sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--paper);
    height: 100dvh;
    overflow: hidden;
  }

  #map { position: absolute; inset: 0; background: var(--paper); }

  /* ---------- key (legend) ---------- */
  .key {
    position: absolute;
    left: 14px; bottom: 26px;
    z-index: 500;
    width: 198px;
    background: #FFFFFF;
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--blue);
    border-radius: 6px;
    box-shadow: 0 4px 18px rgba(22, 22, 31, 0.10);
    padding: 12px 14px 10px;
  }
  .key-ringrow { display: flex; align-items: center; gap: 10px; padding: 4px 2px; font-size: 13px; }
  .ring {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #fff;
    flex: none;
    margin-left: 8px;
  }
  .ring-hour  { border: 3px solid var(--red); }
  .ring-today { border: 3px solid var(--blue); }
  .ring-week  { border: 3px solid #9DA2A6; }
  .key-foot {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.02em;
  }

  /* ---------- station-style sighting dots ---------- */
  .dot {
    background: #fff;
    border-radius: 50%;
    border: 3px solid var(--grey);
    box-shadow: 0 1px 4px rgba(22, 22, 31, 0.25);
  }
  .dot-week  { border-color: #9DA2A6; }
  .dot-today { border-color: var(--blue); }
  .dot-hour  { border-color: var(--red); position: relative; }
  .dot-hour::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid var(--red);
    animation: pulse 1.7s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot-hour::after { animation: none; display: none; }
  }
  /* cameras with >1 sighting: one dot, count in the centre,
     ring colour from the NEWEST sighting */
  .dot-multi {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dot-multi span { font: 700 11px/1 var(--body); }
  .dot-hour.dot-multi span  { color: var(--red); }
  .dot-today.dot-multi span { color: var(--blue); }
  .dot-week.dot-multi span  { color: #6E6E73; }

  /* ---------- popups, tube-map paper treatment ---------- */
  .leaflet-popup-content-wrapper {
    font-family: var(--body);
    border-radius: 8px;
    border-top: 4px solid var(--blue);
    box-shadow: 0 4px 18px rgba(22, 22, 31, 0.18);
  }
  .leaflet-popup-content { margin: 10px 14px; min-width: 168px; }
  .pop-title {
    font-family: var(--display);
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--blue);
    margin: 0 14px 3px 0;
  }
  .pop-line { font-size: 12.5px; color: var(--ink); margin: 1px 0; }
  .pop-img {
    display: block;
    width: 264px;
    max-width: 100%;
    /* JamCam frames are always 352x288 — reserving the box up front
       means the popup opens at its final size, so Leaflet's auto-pan
       brings the WHOLE popup (image included) into view first time */
    aspect-ratio: 352 / 288;
    border-radius: 4px;
    border: 1px solid var(--hairline);
    margin: 4px 0 7px;
    background: #F4F3EE;
  }
  /* arrows for paging through a camera's sightings */
  /* arrows overlaid on the image sides; position counter at the bottom */
  .pop-imgwrap { position: relative; }
  .pop-arrow {
    appearance: none;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 32px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.88);
    color: var(--blue);
    font: 700 16px/1 var(--body);
    cursor: pointer;
  }
  .pop-arrow[data-d="-1"] { left: 7px; }
  .pop-arrow[data-d="1"]  { right: 7px; }
  .pop-arrow:hover:not(:disabled) { background: #fff; }
  .pop-arrow:disabled { opacity: 0.3; cursor: default; }
  .pop-pos {
    display: block;
    text-align: center;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--grey);
  }
  /* ---------- collapsed attribution (ⓘ, expands on click) ---------- */
  .attrib-ctl {
    display: flex;
    align-items: center;
    flex-direction: row-reverse;   /* ⓘ stays pinned right of the text */
    gap: 6px;
  }
  .attrib-toggle {
    appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: #fff;
    color: var(--grey);
    font: 600 13px/1 var(--body);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(22, 22, 31, 0.18);
  }
  .attrib-toggle:hover { color: var(--ink); }
  .attrib-text {
    display: none;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--ink);
    white-space: nowrap;
  }
  .attrib-ctl.open .attrib-text { display: inline-block; }
  .attrib-text a { color: #0078A8; }

  @media (max-width: 560px) {
    .key { left: 10px; right: 10px; bottom: 18px; width: auto; }
    .attrib-text { white-space: normal; max-width: 60vw; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of Waymo sightings in London"></div>

<aside class="key" aria-label="Map key">
  <div class="key-ringrow"><span class="ring ring-hour"></span> Past hour</div>
  <div class="key-ringrow"><span class="ring ring-today"></span> Past 24 hours</div>
  <div class="key-ringrow"><span class="ring ring-week"></span> Past week</div>
  <div class="key-foot" id="key-foot">Loading…</div>
</aside>

<script src="assets/leaflet.js"></script>
<script>
/* The old MapLibre build installed a tile-caching service worker;
   it's no longer needed (raster tiles ride the plain HTTP cache),
   so clean it out of returning visitors' browsers. */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}

/* ============================================================
   Live data: confirmed Waymo sightings from waymo.db on the
   VPS, via the read-only sightings API. Polls every 60s; the
   marker layer is only rebuilt when the data actually changes,
   so an open popup is never yanked away by a no-op refresh.
   ============================================================ */
const API_BASE = ""; // same-origin: nginx on waymonet.com proxies /api/ + /img/ to the sightings API
const POLL_MS = 60000;
const LONDON = "Europe/London";

const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB",
  { timeZone: LONDON, day: "numeric", month: "short", year: "numeric" });
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-GB",
  { timeZone: LONDON, hour: "2-digit", minute: "2-digit" });

/* hour / today / week drive the ring colours — rolling windows,
   matching the key labels; anything older than 24h renders grey
   alongside this week's */
function recency(iso) {
  const age = Date.now() - Date.parse(iso);
  if (age < 3600e3) return "hour";
  return age < 86400e3 ? "today" : "week";
}

/* ============================================================
   Map: plain 2D raster. Pre-rendered CARTO Positron PNGs off a
   CDN paint immediately and HTTP-cache for repeat visits — no
   WebGL, no style/glyph round-trips, no service worker.
   ============================================================ */
const map = L.map("map", {
  center: [51.5095, -0.1470],   /* Mayfair */
  zoom: 12,
  minZoom: 10,
  maxZoom: 16,
  maxBounds: [[51.25, -0.60], [51.75, 0.45]],   /* Greater London + margin */
  maxBoundsViscosity: 1.0,
  zoomControl: false,         /* no corner buttons — scroll/pinch/dbl-click zoom only */
  attributionControl: false   /* replaced by the collapsed ⓘ control below */
});

/* attribution as a collapsed ⓘ — Leaflet's own control is an
   always-open strip; this keeps the licence text one click away */
const AttribControl = L.Control.extend({
  options: { position: "bottomright" },
  onAdd() {
    const div = L.DomUtil.create("div", "attrib-ctl");
    div.innerHTML =
      '<button class="attrib-toggle" aria-label="Map attributions" aria-expanded="false">i</button>' +
      '<span class="attrib-text">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
      '&copy; <a href="https://carto.com/attributions">CARTO</a> · Powered by TfL Open Data</span>';
    const btn = div.querySelector(".attrib-toggle");
    btn.addEventListener("click", () => {
      btn.setAttribute("aria-expanded", String(div.classList.toggle("open")));
    });
    L.DomEvent.disableClickPropagation(div);
    return div;
  }
});
map.addControl(new AttribControl());

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  subdomains: "abcd",
  maxZoom: 16,
  keepBuffer: 4,
  crossOrigin: true
}).addTo(map);

const DOT_PX = { hour: 16, today: 14, week: 12 };
const MULTI_PX = 20;   /* numbered dots need room for the count */

const markers = L.layerGroup().addTo(map);

/* camera data above the picture so the image is never pushed out
   of view; recency chip dropped — the ring colour + timestamp say it.
   `group` = all sightings at one camera, newest first; arrows page
   through them when there's more than one. */
function popupHTML(group, i) {
  const s = group[i];
  const multi = group.length > 1;
  const img =
    `<img class="pop-img" src="${API_BASE}/img/${s.id}_frame.jpg" ` +
    `alt="JamCam frame of sighting #${s.id}" />`;
  return (
    `<p class="pop-title">Waymo · #${s.id}</p>` +
    `<p class="pop-line"><strong>${s.common_name}</strong>${s.view ? ` (facing ${s.view})` : ""}</p>` +
    (multi
      ? `<div class="pop-imgwrap">${img}` +
        `<button class="pop-arrow" data-d="-1" aria-label="Newer sighting"` +
        `${i === 0 ? " disabled" : ""}>&#8249;</button>` +
        `<button class="pop-arrow" data-d="1" aria-label="Older sighting"` +
        `${i === group.length - 1 ? " disabled" : ""}>&#8250;</button></div>`
      : img) +
    `<p class="pop-line">${fmtDate(s.captured_at)} · ${fmtTime(s.captured_at)}</p>` +
    (multi ? `<p class="pop-pos">${i + 1} / ${group.length}</p>` : "")
  );
}

/* warm the browser cache for the frames either side of the one on
   show, so paging never flashes the grey placeholder (images are
   served with max-age=86400, so this costs one fetch each, once) */
function prefetchFrames(group, i) {
  [i - 1, i + 1].forEach(j => {
    if (j >= 0 && j < group.length)
      new Image().src = `${API_BASE}/img/${group[j].id}_frame.jpg`;
  });
}

/* ONE marker per camera: ring colour + size from the NEWEST sighting,
   count in the dot when a camera has several */
function cameraMarker(group) {
  const newest = group[0];
  const when = recency(newest.captured_at);
  const n = group.length;
  const px = n > 1 ? MULTI_PX : DOT_PX[when];
  const m = L.marker([newest.lat, newest.lon], {
    icon: L.divIcon({
      className: `dot dot-${when}${n > 1 ? " dot-multi" : ""}`,
      html: n > 1 ? `<span>${n}</span>` : "",
      iconSize: [px, px]
    }),
    title: n > 1 ? `${n} Waymo sightings — ${newest.common_name}`
                 : `Waymo #${newest.id} — ${newest.common_name}`
  });
  /* maxWidth = the photo's width: long road names wrap rather than
     stretching the box past the image (which pushed the right arrow
     outside the photo) — box hugs the picture, arrows symmetric */
  m.bindPopup(popupHTML(group, 0), { maxWidth: 264, autoPanPadding: L.point(28, 28) });
  /* ONE delegated listener on the popup container — setContent
     re-renders the inner nodes (which killed per-button listeners),
     but the container survives, so delegation keeps working */
  m.on("popupopen", (e) => {
    let idx = 0;
    e.popup.setContent(popupHTML(group, idx));   /* always reopen at newest */
    prefetchFrames(group, idx);
    e.popup.getElement().addEventListener("click", (ev) => {
      const btn = ev.target.closest(".pop-arrow");
      if (!btn || btn.disabled) return;
      /* the content swap detaches the clicked button mid-dispatch;
         Leaflet's "click was inside a popup" check walks the target's
         ancestors, finds none, and treats it as a map click — which
         closes the popup. Stop the event before it reaches the map. */
      ev.stopPropagation();
      idx += Number(btn.dataset.d);
      e.popup.setContent(popupHTML(group, idx)); /* setContent updates an open popup itself */
      prefetchFrames(group, idx);
    });
  });
  return m;
}

/* --- live feed: fetch confirmed sightings, poll for new ones --- */
const foot = document.getElementById("key-foot");
let lastPayload = "";

async function refreshSightings() {
  try {
    const res = await fetch(`${API_BASE}/api/sightings`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = (await res.json()).sightings;
    /* recency buckets shift with the clock, so include them in the
       change check — a dot's ring colour can change without new data */
    const payload = JSON.stringify(rows.map(s => [s.id, recency(s.captured_at)]));
    if (payload !== lastPayload) {
      lastPayload = payload;
      markers.clearLayers();
      /* group by camera; rows arrive newest-first from the API, so
         each group is already ordered newest -> oldest */
      const byCam = new Map();
      rows.forEach(s => {
        if (!byCam.has(s.camera_id)) byCam.set(s.camera_id, []);
        byCam.get(s.camera_id).push(s);
      });
      byCam.forEach(g => markers.addLayer(cameraMarker(g)));
    }
    foot.innerHTML = rows.length
      ? `${rows.length} confirmed sighting${rows.length === 1 ? "" : "s"},<br>` +
        `latest ${fmtDate(rows[0].captured_at)} ${fmtTime(rows[0].captured_at)}`
      : "No confirmed sightings yet";
  } catch (err) {
    if (!foot.textContent || foot.textContent === "Loading…")
      foot.textContent = "Sightings feed unreachable";
  }
}
refreshSightings();
setInterval(refreshSightings, POLL_MS);
</script>
</body>
</html>
