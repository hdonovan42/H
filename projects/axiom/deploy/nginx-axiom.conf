# AXIOM Dashboard — axiom.hjd.ai
# Drop into /etc/nginx/sites-available/axiom then symlink to sites-enabled

server {
    listen 80;
    server_name axiom.hjd.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name axiom.hjd.ai;

    # SSL managed by certbot — paths filled in by `certbot --nginx`
    # ssl_certificate     /etc/letsencrypt/live/axiom.hjd.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/axiom.hjd.ai/privkey.pem;

    root /home/hq/axiom/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Vite hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy → Express
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket upgrade (future-proofing)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
