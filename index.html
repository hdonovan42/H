<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none';">
    <title>H</title>
    <link rel="icon" type="image/png" href="images/H-favicon.png">
    <style>
        body {
            background-color: #FFF1E5;
        }

        .ft-headline {
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: 500;
            font-size: 2.5rem;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: #33302E;
            margin-bottom: 1rem;
        }
        .container {
            display: flex;
            flex-direction: column; /* Align items vertically */
            align-items: center;    /* Center content horizontally */
        }

        .header {
            font-size: 1.8em;         /* Adjust font size as needed */
            margin-bottom: 5px;   /* Space between header and buttons */
            /*border-bottom: 2px solid black; /* Add border */
            padding-bottom: 5px;
            /*padding-left: 20px;*/
            padding-top: 10px;            
        }
        .button-container {
            display: flex;
            align-items: center; /* Vertically align items */
            justify-content: left; /* Adjust alignment as needed */
        }

        .button-container a {
            text-decoration: none; /* Remove default link underline */
            padding: 10px 20px;   /* Add some padding to the buttons */
            padding-left: 0 -10px;
            /*border: 1px solid #000; /* Add a border if you like */
            margin: 0;             /* Remove default margin */
        }

        .button-container a:hover {
            text-decoration: underline;
            color: black;
        }

        .button-container .x-logo {
            padding: 10px 10px; /* Adjust padding as needed */
            display: flex;
            align-items: center;
        }

        .button-container .x-logo svg {
            height: 20px; /* Adjust height as needed */
            width: 20px; /* Adjust width as needed */
            fill: #000; /* Default fill color */
        }

        .button-container .x-logo:hover svg {
            fill: #1DA1F2; /* Fill color on hover - adjust as needed */
        }

        .button-container .x-logo {
          margin: 0 10px; /* Adjust negative margin as needed */
        }

        .bullet {
            margin: 0 5px;
            color: grey;
        }
    </style>
    <script>
        function openX(e) {
           e.preventDefault();
           window.location.href = 'twitter://user?screen_name=fidybucks';
           setTimeout(() => {
               window.location.href = 'https://x.com/fidybucks';
           }, 1000);
        }
    </script>  
</head>
<body>
<div class="container">
    <div class="header ft-headline">H</div>
    <div class="button-container">
