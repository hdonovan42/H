name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/all-in/package-lock.json

      # Build all-in React app
      # Skip wrangler (has heavy native deps via sharp) - only needed for worker deploys
      - name: Build all-in
        working-directory: projects/all-in
        run: |
          npm install --ignore-scripts react react-dom dayjs vite @vitejs/plugin-react
          npm run build

      # Build solaris globe app
      - name: Build solaris
        working-directory: projects/globe/solaris
        run: |
          npm install --ignore-scripts react react-dom three vite @vitejs/plugin-react
          npm run build

      # Replace source dirs with built output
      - name: Prepare site
        run: |
          # all-in
          cd projects/all-in
          mv dist ../all-in-dist
          cd ..
          rm -rf all-in
          mv all-in-dist all-in

          # solaris
          cd globe/solaris
          mv dist ../../solaris-dist
          cd ../..
          rm -rf globe
          mkdir -p globe
          mv solaris-dist globe/solaris

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
